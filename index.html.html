<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>台指交易日誌</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0d0f14;
    --card:#171a22;
    --card2:#1e222c;
    --line:#2a2f3b;
    --text:#e8e9ee;
    --sub:#8b90a0;
    --gold:#d4a53d;
    --gold-dim:#3a3220;
    --red:#e05a5a;
    --red-dim:#3a2222;
    --green:#4ac98a;
    --green-dim:#1f3329;
    --cyan:#5fc7d9;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    padding-bottom:90px;
    transition:background .2s,color .2s;
  }
  body.light{
    --bg:#f4f5f7;
    --card:#ffffff;
    --card2:#f0f1f4;
    --line:#dde1e8;
    --text:#1c1f26;
    --sub:#6b7280;
    --red-dim:#fbe4e4;
    --green-dim:#e2f6ec;
  }
  header{
    position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding:14px 16px 0 16px;
  }
  .headrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .headrow h1{font-size:16px;margin:0;letter-spacing:.5px;}
  .ticker{font-family:var(--mono);font-size:11px;color:var(--sub);}
  .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--sub);}
  .sync-dot.ok{background:var(--green);}
  .sync-dot.err{background:var(--red);}
  .sync-dot.busy{background:var(--gold);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
  #tabOverflowPanel{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;}
  #tabOverflowPanel .tab{border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
  nav::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:8px 12px;font-size:13px;color:var(--sub);
    border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;
  }
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  main{padding:16px;max-width:720px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 12px 0;color:var(--sub);font-weight:600;letter-spacing:.5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 10px;font-size:14px;font-family:inherit;
  }
  input::placeholder,textarea::placeholder{ color:#4a4f5c; font-style:italic; }
  input[type=number]{font-family:var(--mono);}
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:10px;}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;
    color:var(--sub);font-size:13px;cursor:pointer;user-select:none;
  }
  .chip.gold-on{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb, var(--gold) 18%, transparent);}
  .chip.red-on{border-color:var(--red);color:var(--red);background:color-mix(in srgb, var(--red) 18%, transparent);}
  .chip.green-on{border-color:var(--green);color:var(--green);background:color-mix(in srgb, var(--green) 18%, transparent);}
  .primary-btn{
    background:var(--gold);color:#1a1400;border:none;border-radius:8px;padding:11px 16px;
    font-size:14px;font-weight:600;cursor:pointer;width:100%;
  }
  .primary-btn:disabled{opacity:.4;}
  .ghost-btn{
    background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:13px;cursor:pointer;
  }
  .danger-btn{color:var(--red);border-color:var(--red-dim);}
  .stat{text-align:center;}
  .stat .n{font-family:var(--mono);font-size:20px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--sub);margin-top:2px;}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .v{font-family:var(--mono);}
  .up{color:var(--red);} .down{color:var(--green);}
  .entry{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:8px;}
  .entry-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:6px;}
  .entry-note{font-size:13px;line-height:1.5;color:var(--text);opacity:.85;white-space:pre-wrap;}
  .entry-actions{display:flex;gap:8px;margin-top:8px;}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:20px 0;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold);}
  .checklist-item .txt{flex:1;font-size:14px;}
  .del-x{color:var(--sub);cursor:pointer;font-size:16px;padding:0 6px;}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--sub);}
  .pill.long{background:var(--red-dim);color:var(--red);}
  .pill.short{background:var(--green-dim);color:var(--green);}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--line);padding:10px 18px;border-radius:20px;
    font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;
  }
  .toast.show{opacity:1;}
  .subtabs{display:flex;gap:6px;margin-bottom:12px;}
  .subtab{padding:6px 12px;border-radius:8px;font-size:12px;background:var(--card2);color:var(--sub);cursor:pointer;}
  .subtab.on{background:color-mix(in srgb, var(--gold) 18%, transparent);color:var(--gold);}
  .hint{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5;}
  a{color:var(--cyan);}
</style>
</head>
<body>

<header>
  <div class="headrow">
    <h1 id="appTitle">📓 台指交易日誌</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="ticker"><span id="syncDot" class="sync-dot"></span><span id="syncText">未同步</span> <span style="opacity:.4;">v2.21</span></div>
      <span id="settingsGear" style="cursor:pointer;font-size:18px;" onclick="openSettings()">⚙</span>
    </div>
  </div>
  <nav id="tabs"></nav>
  <div id="tabOverflowPanel"></div>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>
<div id="imgViewer" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;padding:20px;" onclick="closeImageViewer()">
  <img id="imgViewerImg" src="" style="max-width:100%;max-height:100%;border-radius:8px;">
</div>

<script>
window.addEventListener('error', function(e){
  alert('程式錯誤：'+e.message+'\n(在 '+(e.filename||'')+':'+e.lineno+')');
});
window.addEventListener('unhandledrejection', function(e){
  alert('連線/程式錯誤：'+(e.reason && e.reason.message ? e.reason.message : e.reason));
});
/* ---------------- state ---------------- */
const LS_KEY = 'tj_state_v1';
const defaultState = () => ({
  meta:{ sha:null, updatedAt:null },
  settings:{ token:'', owner:'', repo:'', path:'data.json', branch:'main',
             feePerSide:15, taxPerSide:9, multiplier:10, geminiKey:'', theme:'gold', mode:'dark', appTitle:'台指交易日誌',
             marginInit:0, marginMaintain:0, futuresGoal:0, futuresCapital:0, tabConfig:null },
  marketData: [],
  sentiment: [],
  plans: [],
  checklistTemplate: ['確認今日盤前規劃方向','檢查目前部位風險','設定停損點位','確認口數符合資金控管','情緒是否平穩，非報復性交易'],
  checklistLog: [],
  trades: [],
  stockAccounts: ['我','媽媽','爸爸','婆婆','老公','語安','語樂'],
  stockTrades: [],
  stockCapital: {},
  stockCashLedger: [],
  dividendHoldings: [],
  dividendRecords: [],
  dividendGoal: 10000,
  futuresBalanceLog: [],
  futuresCashLedger: [],
  customLinks: [],
  techTopCategories: ['股票','期貨'],
  techCategories: ['技術面','產業面','總體經濟','個股筆記'],
  techNotes: []
});
let state = loadLocal();
let activeTab = 'data';
let pushTimer = null;

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return {...defaultState(), ...JSON.parse(raw)};
  }catch(e){}
  return defaultState();
}
function saveLocal(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function markDirty(){
  state.meta.updatedAt = new Date().toISOString();
  saveLocal();
  scheduleSync();
  render();
}

/* ---------------- toast ---------------- */
function viewImage(src){
  const viewer = document.getElementById('imgViewer');
  document.getElementById('imgViewerImg').src = src;
  viewer.style.display = 'flex';
}
function closeImageViewer(){
  document.getElementById('imgViewer').style.display = 'none';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ---------------- github sync ---------------- */
function setSyncStatus(kind, text){
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot ' + (kind||'');
  txt.textContent = text;
}

function ghConfigured(){
  const s = state.settings;
  return s.token && s.owner && s.repo && s.path;
}

async function ghGet(){
  const s = state.settings;
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${encodeURIComponent(s.path)}?ref=${encodeURIComponent(s.branch||'main')}`;
  const res = await fetch(url, { headers:{ 'Authorization':'token '+s.token, 'Accept':'application/vnd.github+json' }});
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('讀取失敗 '+res.status);
  const json = await res.json();
  const content = decodeURIComponent(escape(atob(json.content.replace(/\n/g,''))));
  return { data: JSON.parse(content), sha: json.sha };
}

async function ghPut(dataObj, sha){
  const s = state.settings;
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${encodeURIComponent(s.path)}`;
  const body = {
    message: '同步交易日誌 ' + new Date().toLocaleString('zh-TW'),
    content: btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2)))),
    branch: s.branch || 'main'
  };
  if(sha) body.sha = sha;
  const res = await fetch(url, {
    method:'PUT',
    headers:{ 'Authorization':'token '+s.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message || ('寫入失敗 '+res.status));
  }
  const json = await res.json();
  return json.content.sha;
}

function scheduleSync(){
  if(!ghConfigured()) { setSyncStatus('', '未設定同步'); return; }
  clearTimeout(pushTimer);
  setSyncStatus('busy', '待同步…');
  pushTimer = setTimeout(pushToGithub, 1500);
}

const MERGE_ARRAY_KEYS = ['marketData','sentiment','plans','checklistLog','trades','stockTrades','stockCashLedger','futuresCashLedger','customLinks','techNotes','dividendPayouts','dividendHoldings'];
const MERGE_LIST_KEYS = ['techTopCategories','techCategories','stockAccounts','checklistTemplate'];
function mergeStateForConflict(localState, remoteState){
  const merged = { ...remoteState, ...localState };
  merged.stockCapital = { ...(remoteState.stockCapital||{}), ...(localState.stockCapital||{}) };
  MERGE_ARRAY_KEYS.forEach(key=>{
    const localArr = localState[key] || [];
    const remoteArr = remoteState[key] || [];
    const map = new Map();
    remoteArr.forEach(item=> item && item.id && map.set(item.id, item));
    localArr.forEach(item=> item && item.id && map.set(item.id, item));
    merged[key] = [...map.values()];
  });
  MERGE_LIST_KEYS.forEach(key=>{
    const localArr = localState[key]||[];
    const remoteArr = remoteState[key]||[];
    merged[key] = localArr.length ? localArr : [...new Set([...localArr, ...remoteArr])];
  });
  return merged;
}
async function pushToGithub(retrying){
  if(!ghConfigured()){ alert('尚未設定完成：token='+(!!state.settings.token)+' owner='+(!!state.settings.owner)+' repo='+(!!state.settings.repo)+' path='+(!!state.settings.path)); return; }
  setSyncStatus('busy', retrying? '解決衝突中…' : '同步中…');
  try{
    const payload = { ...state };
    delete payload.settings; // never store token in the synced file
    const sha = await ghPut(payload, state.meta.sha);
    state.meta.sha = sha;
    saveLocal();
    setSyncStatus('ok', '已同步 '+new Date().toLocaleTimeString('zh-TW'));
  }catch(e){
    console.error(e);
    if(!retrying && /does not match|409|422/i.test(e.message)){
      try{
        const remote = await ghGet();
        if(remote && remote.data){
          const keepSettings = state.settings;
          const merged = mergeStateForConflict(state, remote.data);
          state = { ...defaultState(), ...merged, settings: keepSettings, meta:{ sha: remote.sha, updatedAt: new Date().toISOString() } };
          saveLocal();
          render();
          await pushToGithub(true);
          return;
        }
      }catch(e2){
        console.error(e2);
      }
    }
    alert('推送失敗：'+e.message);
    setSyncStatus('err', '同步失敗：'+e.message);
  }
}

async function pullFromGithub(silent){
  if(!ghConfigured()){ if(!silent) toast('請先在「設定」填入 GitHub 資訊'); return; }
  setSyncStatus('busy', '讀取中…');
  try{
    const remote = await ghGet();
    if(remote && remote.data){
      const keepSettings = state.settings;
      state = { ...defaultState(), ...remote.data, settings: keepSettings, meta:{ sha: remote.sha, updatedAt: remote.data.meta?.updatedAt||null } };
      saveLocal();
      setSyncStatus('ok', '已從雲端讀取');
      render();
      if(!silent) toast('已從 GitHub 讀取最新資料');
    } else {
      setSyncStatus('', '雲端尚無資料，將於下次變更時建立');
      if(!silent) toast('雲端還沒有資料檔，儲存任何一筆記錄後會自動建立');
    }
  }catch(e){
    console.error(e);
    setSyncStatus('err', '讀取失敗：'+e.message);
    if(!silent) toast('讀取失敗：'+e.message);
  }
}

/* ---------------- render root ---------------- */
const ALL_TABS = [
  {id:'data', label:'數據'},
  {id:'sentiment', label:'市場情緒'},
  {id:'plan', label:'盤前記錄'},
  {id:'confirm', label:'交易前確認'},
  {id:'log', label:'期貨紀錄'},
  {id:'stock', label:'股票紀錄'},
  {id:'cash', label:'💰資金管理'},
  {id:'dividend', label:'📈存股目標'},
  {id:'analytics', label:'📊損益總覽'},
  {id:'links', label:'🔗常用網站'},
  {id:'notes', label:'📚筆記'},
];
function getVisibleTabs(){
  const cfg = state.settings.tabConfig;
  if(!cfg || !cfg.length) return ALL_TABS;
  const map = Object.fromEntries(ALL_TABS.map(t=>[t.id,t]));
  const list = cfg.filter(c=>c.visible!==false && map[c.id]).map(c=>map[c.id]);
  return list.length ? list : ALL_TABS;
}
function openSettings(){ activeTab = 'settings'; render(); }

let showTabOverflow = false;
const PRIMARY_TAB_COUNT = 5;
function renderOverflowPanel(list){
  const panel = document.getElementById('tabOverflowPanel');
  if(!panel) return;
  if(!list.length){ panel.innerHTML=''; return; }
  panel.innerHTML = list.map(t=>`<div class="tab ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  panel.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{ activeTab = el.dataset.tab; showTabOverflow=false; render(); });
}
function render(){
  const visibleTabs = getVisibleTabs();
  if(activeTab!=='settings' && !visibleTabs.find(t=>t.id===activeTab)) activeTab = visibleTabs[0]?.id || 'data';
  const nav = document.getElementById('tabs');
  const primary = visibleTabs.slice(0, PRIMARY_TAB_COUNT);
  const overflow = visibleTabs.slice(PRIMARY_TAB_COUNT);
  const activeInOverflow = overflow.find(t=>t.id===activeTab);
  let html = primary.map(t=>`<div class="tab ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  if(overflow.length){
    html += `<div class="tab ${activeInOverflow?'active':''}" id="tabMoreBtn">⋯ 更多${activeInOverflow?`：${activeInOverflow.label}`:''}</div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.tab[data-tab]').forEach(el=>el.onclick=()=>{ activeTab = el.dataset.tab; showTabOverflow=false; render(); });
  const moreBtn = document.getElementById('tabMoreBtn');
  if(moreBtn) moreBtn.onclick = ()=>{ showTabOverflow = !showTabOverflow; renderOverflowPanel(overflow); };
  renderOverflowPanel(showTabOverflow ? overflow : []);

  const titleEl = document.getElementById('appTitle');
  if(titleEl) titleEl.textContent = '📓 ' + (state.settings.appTitle || '台指交易日誌');

  const main = document.getElementById('main');
  if(activeTab==='data') main.innerHTML = renderData();
  else if(activeTab==='sentiment') main.innerHTML = renderSentiment();
  else if(activeTab==='plan') main.innerHTML = renderPlan();
  else if(activeTab==='confirm') main.innerHTML = renderConfirm();
  else if(activeTab==='log') main.innerHTML = renderLog();
  else if(activeTab==='stock') main.innerHTML = renderStock();
  else if(activeTab==='cash') main.innerHTML = renderCash();
  else if(activeTab==='dividend') main.innerHTML = renderDividend();
  else if(activeTab==='analytics') main.innerHTML = renderAnalytics();
  else if(activeTab==='links') main.innerHTML = renderLinks();
  else if(activeTab==='notes') main.innerHTML = renderNotes();
  else if(activeTab==='settings') main.innerHTML = renderSettings();
  bindTabEvents();
}

/* ---------------- 數據 tab ---------------- */
let dataHistoryDate = '';
function renderData(){
  const list = [...state.marketData].sort((a,b)=>b.date.localeCompare(a.date)||b.session.localeCompare(a.session));
  const latest = list[0];
  const shown = limitedHistory(list, dataHistoryDate);
  return `
  <div class="card">
    <h2>新增市場數據</h2>
    <div class="grid2">
      <div class="field"><label>日期</label><input type="date" id="d_date" value="${todayStr()}"></div>
      <div class="field"><label>盤別</label>
        <div class="btnrow">
          <div class="chip gold-on" data-f="d_session" data-v="早盤" onclick="pick(this)">早盤</div>
          <div class="chip" data-f="d_session" data-v="夜盤" onclick="pick(this)">夜盤</div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>正逆價差</label><input type="number" id="d_spread" placeholder="-10">
    </div>
    <div class="grid2">
      <div class="field"><label>VIX</label><input type="number" step="0.01" id="d_vix" placeholder="31.09"></div>
      <div class="field"><label>外資淨口數</label><input type="number" id="d_foreign" placeholder="+380"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>收盤</label><input type="number" id="d_close" placeholder="46005"></div>
      <div class="field"><label>振幅(pt)</label><input type="number" id="d_range" placeholder="410"></div>
    </div>
    <button class="primary-btn" onclick="saveMarketData()">儲存數據</button>
  </div>

  ${latest ? `
  <div class="card">
    <h2>最新摘要（${latest.date} ${latest.session}）</h2>
    <div class="grid3">
      <div class="stat"><div class="n">${fmt(latest.spread)}</div><div class="l">正逆價差</div></div>
      <div class="stat"><div class="n ${latest.vix>=30?'up':'down'}">${fmt(latest.vix)}</div><div class="l">VIX</div></div>
    </div>
    <div class="grid3" style="margin-top:10px;">
      <div class="stat"><div class="n">${fmt(latest.foreign)}</div><div class="l">外資淨口數</div></div>
      <div class="stat"><div class="n">${fmt(latest.close)}</div><div class="l">收盤</div></div>
      <div class="stat"><div class="n">${fmt(latest.range)}</div><div class="l">振幅</div></div>
    </div>
  </div>` : ''}

  <div class="card">
    <h2>歷史紀錄</h2>
    ${dateJumpPicker(list, dataHistoryDate, 'setDataHistoryDate')}
    ${shown.length? shown.map(d=>`
      <div class="entry">
        <div class="entry-top"><span>${d.date} · ${d.session}</span><span class="del-x" onclick="delItem('marketData','${d.id}', this)">✕</span></div>

        <div class="kv"><span>VIX / 外資淨口數</span><span class="v">${fmt(d.vix)} / ${fmt(d.foreign)}</span></div>

function saveReview(id){
  const plan = state.plans.find(p=>p.id===id);
  if(!plan) return;
  const open = num(document.getElementById('rv_open').value);
  const high = num(document.getElementById('rv_high').value);
  const low = num(document.getElementById('rv_low').value);
  const close = num(document.getElementById('rv_close').value);

function savePlan(){
  const g=id=>document.getElementById(id).value;

  const directions = [...document.querySelectorAll('[data-multi="p_dir"].gold-on')].map(e=>e.dataset.v);
  const pattern = document.querySelector('[data-f="p_pattern"].gold-on')?.dataset.v || '';
  syncUpLevels(); syncDownLevels();
  const upLevels = planUpLevels.filter(l=>l.price!=='' && l.price!==null && l.price!==undefined).map(l=>({price:num(l.price), note:l.note}));
  const downLevels = planDownLevels.filter(l=>l.price!=='' && l.price!==null && l.price!==undefined).map(l=>({price:num(l.price), note:l.note}));
  state.plans.push({
    id:uid(), date:g('p_date'), session, directions, pattern,
    keyLevel: num(g('p_key')), upLevels, downLevels, note:g('p_note'), images:[...planImages]
  });
  planUpLevels = []; planDownLevels = []; planImages = [];

/* ---------------- 圖片分析（免費 OCR，全部在本機執行）---------------- */
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const DEEP_ANALYSIS_PROMPT = `你是一位專業的台股/台指期貨盤前分析師。請仔細閱讀這張截圖裡的所有數據與文字內容（可能包含：夜盤期貨行情、ADR、四大美股指數、外資與自營商期貨籌碼、選擇權籌碼等），然後產出一份完整的繁體中文盤前分析報告，格式和風格必須完全比照下面這個範本的結構（標題、分節、符號都要），但內容要根據圖片裡實際的數字與變化來寫，不可以照抄範本的數字：

負面反證：（列出反對前述推論、或值得警惕的證據）

四、焦點事件預告（如果圖片或你的知識中有提到近期重要財經事件、財報、會議，列出來；沒有就寫「無明顯排定事件」）

五、重點族群與個股判斷
（針對圖片中提到的類股或個股，各給一個 🟢中性偏多／🟡中性偏守／🔴偏空防禦 的判斷，並附一句理由）

六、今日結論
美股整體：（🟢/🟡/🔴 + 一句話）
[相關族群]：（🟢/🟡/🔴 + 一句話）
今日台股預期：（🟢/🟡/🔴 + 一句話）

最後附上「整體[偏多/偏空]可信度：約 XX%」以及一項次要判斷的可信度百分比。

只輸出這份報告本身，不要加任何額外的開場白或說明。`;

async function deepAnalyze(){
  const key = state.settings.geminiKey;
  if(!key){ toast('請先到「設定」填入 Gemini API Key'); return; }
  const fileInput = document.getElementById('gm_file');
  const files = [...fileInput.files];
  if(!files.length){ toast('請先選擇圖片'); return; }
  const preview = document.getElementById('gmPreview');
  preview.innerHTML = '';
  const status = document.createElement('div');
  status.className = 'hint';
  status.style.marginTop = '10px';
  status.textContent = `AI 分析中…（共 ${files.length} 張，請稍候）`;
  preview.appendChild(status);

  for(let i=0;i<files.length;i++){
    const file = files[i];
    status.textContent = `AI 分析中…（第 ${i+1}/${files.length} 張）`;
    try{
      const dataUrl = await fileToBase64(file);
      const base64 = dataUrl.split(',')[1];
      const mediaType = file.type || 'image/jpeg';
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          contents:[{ parts:[
            { text: DEEP_ANALYSIS_PROMPT },
            { inline_data:{ mime_type: mediaType, data: base64 } }
          ]}]
        })
      });
      if(!res.ok){
        const errBody = await res.text();
        throw new Error('API 錯誤 '+res.status+'：'+errBody.slice(0,200));
      }
      const json = await res.json();
      const text = json.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '（沒有取得內容，請重試）';
      renderDeepPreview(text, i);
    }catch(e){
      console.error(e);
      const errBox = document.createElement('div');
      errBox.className = 'hint';
      errBox.style.color = 'var(--red)';
      errBox.textContent = `第 ${i+1} 張分析失敗：${e.message}`;
      preview.appendChild(errBox);
    }
  }
  status.textContent = `分析完成（共 ${files.length} 張），確認內容後可儲存為市場情緒筆記`;
}
function renderDeepPreview(text, idx){

function tradePoints(t){
  const entryPts = (t.entries||[]).reduce((s,e)=>s+(e.price*e.qty||0),0);
  const entryQty = (t.entries||[]).reduce((s,e)=>s+(e.qty||0),0);
  const exitPts = (t.exits||[]).reduce((s,e)=>s+(e.price*e.qty||0),0);
  const exitQty = (t.exits||[]).reduce((s,e)=>s+(e.qty||0),0);
  if(!entryQty||!exitQty) return 0;
  const avgEntry = entryPts/entryQty, avgExit = exitPts/exitQty;
  const qty = Math.min(entryQty, exitQty);
  return t.direction==='多' ? (avgExit-avgEntry)*qty : (avgEntry-avgExit)*qty;
}
function tradeCost(t){
  const s = state.settings;
  const feeSide = s.feePerSide||0, taxSide = s.taxPerSide||0;
  const entryQty = (t.entries||[]).reduce((sum,e)=>sum+(e.qty||0),0);
  const exitQty = (t.exits||[]).reduce((sum,e)=>sum+(e.qty||0),0);
  const qty = Math.min(entryQty, exitQty) || 0;
  const fee = feeSide * qty * 2; // 進+出兩邊手續費
  const tax = taxSide * qty * 2; // 進+出兩邊交易稅（固定金額）
  return fee + tax;
}
function tradeNetAmount(t){
  const mult = state.settings.multiplier||10;
  return tradePoints(t)*mult - tradeCost(t);
}
let editingTradeId = null;

let futuresDateFrom = '';
let futuresHistoryDate = '';

function isTradeOpen(t){
  return !((t.exits||[]).reduce((s,e)=>s+(e.qty||0),0) > 0);
}
function monthlyBreakdown(trades, profitFn, dateField){
  const map = {};
  trades.forEach(t=>{
    const d = t[dateField];
    if(!d) return;
    const p = profitFn(t);
    if(p===null) return;
    const ym = d.slice(0,7);
    map[ym] = (map[ym]||0) + p;
  });
  return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
}
function yearlyBreakdown(trades, profitFn, dateField){
  const map = {};
  trades.forEach(t=>{
    const d = t[dateField];
    if(!d) return;
    const p = profitFn(t);
    if(p===null) return;
    const y = d.slice(0,4);
    map[y] = (map[y]||0) + p;
  });
  return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
}
function breakdownCard(title, trades, profitFn, dateField){
  const months = monthlyBreakdown(trades, profitFn, dateField).slice(0,12);

let stockAccountFilter = '全部';
let stockDateFrom = '';
let stockDateTo = '';
let stockStatusFilter = 'all';
function getExitLots(t){
  if(t.exitLots && t.exitLots.length) return t.exitLots;
  if(t.exitPrice!==null && t.exitPrice!==undefined && t.exitPrice!==''){
    return [{date:t.exitDate, price:t.exitPrice, qty:t.exitQty||t.entryQty, fee:t.exitFee||0}];
  }
  return [];
}
function stockSoldQty(t){
  return getExitLots(t).reduce((s,l)=>s+(l.qty||0),0);
}
function stockRemainingQty(t){
  return Math.max(0, (t.entryQty||0) - stockSoldQty(t));
}
function stockIsOpen(t){
  return stockRemainingQty(t) > 0;
}
function stockProfit(t){
  const exits = getExitLots(t);
  if(!exits.length) return null;
  const soldQty = exits.reduce((s,l)=>s+(l.qty||0),0);
  const exitVal = exits.reduce((s,l)=>s+(l.price*l.qty||0),0);
  const exitFeeTotal = exits.reduce((s,l)=>s+(l.fee||0),0);
  const entryFeePortion = (t.entryFee||0) * (soldQty / (t.entryQty||soldQty||1));
  const gross = t.direction==='多' ? (exitVal - t.entryPrice*soldQty) : (t.entryPrice*soldQty - exitVal);
  return gross - entryFeePortion - exitFeeTotal;
}
function stockLatestExitDate(t){
  const exits = getExitLots(t);
  if(!exits.length) return null;
  return exits.map(l=>l.date).filter(Boolean).sort().slice(-1)[0] || null;
}
function stockAccountBalance(account){
  const initial = state.stockCapital[account] || 0;
  const ledgerNet = state.stockCashLedger.filter(l=>l.account===account)
    .reduce((s,l)=> s + (['存入','借入'].includes(l.type) ? l.amount : -l.amount), 0);
  const trades = state.stockTrades.filter(t=>t.account===account);
  const spent = trades.reduce((s,t)=> s + (t.entryPrice*t.entryQty + (t.entryFee||0)), 0);
  const returned = trades.reduce((s,t)=>{
    const exits = getExitLots(t);
    return s + exits.reduce((sum,l)=> sum + (l.price*l.qty - (l.fee||0)), 0);
  }, 0);
  return initial + ledgerNet - spent + returned;
}
function buildCashHistory(account){
  const rows = [];
  const initial = state.stockCapital[account] || 0;
  if(initial){
    rows.push({ date:'0000-00-00', sortKey:'0000-00-00 0', desc:'起始資金', amount:initial, kind:'in' });
  }
  state.stockCashLedger.filter(l=>l.account===account).forEach(l=>{
    const isIn = ['存入','借入'].includes(l.type);
    rows.push({ date:l.date, sortKey:l.date+' 1', desc:l.type+(l.note?'：'+l.note:''), amount: isIn? l.amount : -l.amount, kind:isIn?'in':'out' });
  });
  state.stockTrades.filter(t=>t.account===account).forEach(t=>{
    rows.push({ date:t.entryDate, sortKey:t.entryDate+' 2',
      desc:`買進 ${t.code}${t.name?' '+t.name:''} ${t.entryQty}股 @${t.entryPrice}`,
      amount: -(t.entryPrice*t.entryQty + (t.entryFee||0)), kind:'out' });
    getExitLots(t).forEach(l=>{
      const soldQty = l.qty;
      const entryFeePortion = (t.entryFee||0) * (soldQty / (t.entryQty||soldQty||1));
      const gross = t.direction==='多' ? (l.price-t.entryPrice)*soldQty : (t.entryPrice-l.price)*soldQty;
      const p = gross - entryFeePortion - (l.fee||0);
      rows.push({ date:l.date, sortKey:(l.date||'0000-00-00')+' 3',
        desc:`賣出 ${t.code}${t.name?' '+t.name:''} ${l.qty}股 @${l.price}（損益 ${p>=0?'+':''}${Math.round(p).toLocaleString()}）`,
        amount: l.price*l.qty - (l.fee||0), kind:'in' });
    });
  });
  rows.sort((a,b)=>a.sortKey.localeCompare(b.sortKey));
  let running = 0;
  rows.forEach(r=>{ running += r.amount; r.balance = running; });
  return rows.reverse();
}

  const direction = document.querySelector('[data-f="st_dir"].red-on,[data-f="st_dir"].green-on')?.dataset.v || '多';

  };

function toggleNotesTop(c){

  else notesTopFilter.push(c);
  if(!notesTopFilter.length) notesTopFilter = ['全部'];
  render();
}
function toggleNotesCat(c){
  if(c==='全部'){ notesCategoryFilter = ['全部']; render(); return; }
  notesCategoryFilter = notesCategoryFilter.filter(x=>x!=='全部');

function addTopCategory(){

}
function delTopCategory(i){
  state.techTopCategories.splice(i,1);

}
function moveTop(i,dir){ moveArrayItem(state.techTopCategories, i, dir); markDirty(); }
function addNoteCategory(){
  const v = document.getElementById('nt_newcat').value.trim();

  if(!state.techCategories.includes(v)) state.techCategories.push(v);

function delSubCategory(i){
  state.techCategories.splice(i,1);
  markDirty();
}
function moveSub(i,dir){ moveArrayItem(state.techCategories, i, dir); markDirty(); }
function renameTopCategory(i, newName){
  newName = newName.trim();
  if(!newName) return;
  const oldName = state.techTopCategories[i];
  if(oldName === newName) return;
  state.techTopCategories[i] = newName;
  state.techNotes.forEach(n=>{ if(n.topCategory===oldName) n.topCategory = newName; });
  markDirty();
}
function renameSubCategory(i, newName){

  if(!newName) return;
  const oldName = state.techCategories[i];
  if(oldName === newName) return;
  state.techCategories[i] = newName;
  state.techNotes.forEach(n=>{ if(n.category===oldName) n.category = newName; });
  markDirty();
}

async function addNoteImages(input){
  syncNoteDraft();
  const files = [...input.files];
  for(const f of files){
    const dataUrl = await fileToBase64(f);
    editingNoteImages.push(dataUrl);
  }
  input.value = '';
  render();
}
function removeNoteImage(idx){
  syncNoteDraft();
  editingNoteImages.splice(idx,1);
  render();
}
function saveNote(){
  const topCategory = document.querySelector('[data-f="nt_top"].gold-on')?.dataset.v || state.techTopCategories[0] || '';
  const category = document.querySelector('[data-f="nt_cat"].gold-on')?.dataset.v || state.techCategories[0] || '';
  const date = document.getElementById('nt_date').value || todayStr();
  const title = document.getElementById('nt_title').value.trim();
  const content = document.getElementById('nt_content').value;
  if(!content.trim()){ toast('請輸入內容'); return; }
  const images = [...editingNoteImages];
  if(editingNoteId){
    const idx = state.techNotes.findIndex(n=>n.id===editingNoteId);
    if(idx>-1) state.techNotes[idx] = {...state.techNotes[idx], date, topCategory, category, title, content, images};
    editingNoteId = null;
    editingNoteImages = [];
    noteDraft = null;
    markDirty(); toast('已更新筆記');
  } else {
    state.techNotes.push({id:uid(), date, topCategory, category, title, content, images});
    editingNoteImages = [];
    noteDraft = null;
    markDirty(); toast('已儲存筆記');
  }
}
function editNote(id){
  editingNoteId = id;
  const n = state.techNotes.find(x=>x.id===id);
  editingNoteImages = n && n.images ? [...n.images] : [];
  noteDraft = null;
  render();
  document.getElementById('main').scrollIntoView({behavior:'smooth'});
}
function cancelEditNote(){ editingNoteId = null; editingNoteImages = []; noteDraft = null; render(); }

/* ---------------- 損益總覽 tab ---------------- */
let analyticsSrc = { futures:true, stock:true };
let analyticsAccounts = ['全部'];
let analyticsFrom = '';
let analyticsTo = '';
function renderAnalytics(){
  const accounts = state.stockAccounts;
  const from = analyticsFrom, to = analyticsTo;
  const inRange = d => (!from || d>=from) && (!to || d<=to);

  let rows = [];
  if(analyticsSrc.futures){
    state.trades.filter(t=>!isTradeOpen(t) && inRange(t.date)).forEach(t=>{
      rows.push({date:t.date, amount:tradeNetAmount(t), src:'期貨'});
    });
  }
  if(analyticsSrc.stock){
    const useAccounts = analyticsAccounts.includes('全部') ? accounts : analyticsAccounts;
    state.stockTrades.filter(t=>useAccounts.includes(t.account)).forEach(t=>{
      const p = stockProfit(t);
      if(p===null) return;
      const d = stockLatestExitDate(t);
      if(!d || !inRange(d)) return;
      rows.push({date:d, amount:p, src:'股票'});
    });
  }
  const total = rows.reduce((s,r)=>s+r.amount,0);
  const monthMap = {}, yearMap = {};
  rows.forEach(r=>{
    const ym = r.date.slice(0,7), y = r.date.slice(0,4);
    monthMap[ym] = (monthMap[ym]||0) + r.amount;
    yearMap[y] = (yearMap[y]||0) + r.amount;
  });
  const months = Object.entries(monthMap).sort((a,b)=>b[0].localeCompare(a[0]));
  const years = Object.entries(yearMap).sort((a,b)=>b[0].localeCompare(a[0]));

  return `
  <div class="card">
    <h2>📊 損益總覽</h2>
    <div class="field"><label>資料來源</label>
      <div class="btnrow">
        <div class="chip ${analyticsSrc.futures?'gold-on':''}" onclick="toggleAnalyticsSrc('futures')">期貨</div>
        <div class="chip ${analyticsSrc.stock?'gold-on':''}" onclick="toggleAnalyticsSrc('stock')">股票</div>
      </div>
    </div>
    ${analyticsSrc.stock? `
    <div class="field"><label>股票帳戶（可複選）</label>
      <div class="btnrow">
        <div class="chip ${analyticsAccounts.includes('全部')?'gold-on':''}" onclick="toggleAnalyticsAccount('全部')">全部</div>
        ${accounts.map(a=>`<div class="chip ${analyticsAccounts.includes(a)?'gold-on':''}" onclick="toggleAnalyticsAccount('${a}')">${a}</div>`).join('')}
      </div>
    </div>` : ''}
    <div class="grid2">
      <div class="field"><label>起始日期</label><input type="date" value="${from}" onchange="setAnalyticsFrom(this.value)"></div>
      <div class="field"><label>結束日期</label><input type="date" value="${to}" onchange="setAnalyticsTo(this.value)"></div>
    </div>
    <div style="font-family:var(--mono);font-size:26px;font-weight:700;color:${total>=0?'var(--red)':'var(--green)'};margin-top:10px;">
      ${total>=0?'+':''}${Math.round(total).toLocaleString()} 元
    </div>
  </div>
  <div class="card">
    <h2>明細</h2>
    <div class="subtabs">
      <div class="subtab on" onclick="this.parentElement.querySelectorAll('.subtab').forEach(e=>e.classList.remove('on'));this.classList.add('on');this.parentElement.nextElementSibling.style.display='block';this.parentElement.nextElementSibling.nextElementSibling.style.display='none';">按月</div>
      <div class="subtab" onclick="this.parentElement.querySelectorAll('.subtab').forEach(e=>e.classList.remove('on'));this.classList.add('on');this.parentElement.nextElementSibling.style.display='none';this.parentElement.nextElementSibling.nextElementSibling.style.display='block';">按年</div>
    </div>
    <div>
      ${months.length? months.map(([ym,v])=>`<div class="kv"><span>${ym}</span><span class="v" style="color:${v>=0?'var(--red)':'var(--green)'}">${v>=0?'+':''}${Math.round(v).toLocaleString()}</span></div>`).join('') : '<div class="empty">尚無資料</div>'}
    </div>
    <div style="display:none;">
      ${years.length? years.map(([y,v])=>`<div class="kv"><span>${y}</span><span class="v" style="color:${v>=0?'var(--red)':'var(--green)'}">${v>=0?'+':''}${Math.round(v).toLocaleString()}</span></div>`).join('') : '<div class="empty">尚無資料</div>'}
    </div>
  </div>`;
}
function toggleAnalyticsSrc(k){
  analyticsSrc[k] = !analyticsSrc[k];
  if(!analyticsSrc.futures && !analyticsSrc.stock) analyticsSrc[k] = true;
  render();
}
function toggleAnalyticsAccount(a){
  if(a==='全部'){ analyticsAccounts = ['全部']; render(); return; }
  analyticsAccounts = analyticsAccounts.filter(x=>x!=='全部');
  if(analyticsAccounts.includes(a)) analyticsAccounts = analyticsAccounts.filter(x=>x!==a);

function getTabConfigFull(){
  const cfg = state.settings.tabConfig;
  if(cfg && cfg.length){
    const existingIds = cfg.map(c=>c.id);
    const missing = ALL_TABS.filter(t=>!existingIds.includes(t.id)).map(t=>({id:t.id, visible:true}));
    return [...cfg, ...missing];
  }
  return ALL_TABS.map(t=>({id:t.id, visible:true}));
}
function toggleTabVisible(id){
  let cfg = getTabConfigFull();
  cfg = cfg.map(c=> c.id===id ? {...c, visible: c.visible===false} : c);
  state.settings.tabConfig = cfg;
  markDirty();
}
function moveTab(id, dir){
  let cfg = getTabConfigFull();
  const idx = cfg.findIndex(c=>c.id===id);
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=cfg.length) return;
  [cfg[idx], cfg[newIdx]] = [cfg[newIdx], cfg[idx]];
  state.settings.tabConfig = cfg;
  markDirty();
}

        <button class="ghost-btn" onclick="pullFromGithub(false)">⬇ 從雲端讀取</button>
        <button class="ghost-btn" onclick="pushToGithub()">⬆ 立即同步</button>
      </div>
    </div>`;
  } else if(settingsSection==='ai'){
    body = `
    <div class="card">
      <h2>🧠 AI 深度分析設定（Gemini，免費）</h2>
      <div class="hint">到 <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> 用 Google 帳號登入，點「Create API key」即可免費取得，不需綁信用卡。免費額度有每分鐘/每日的請求數限制，個人使用通常足夠。Key 只存在這台裝置本機。</div>
      <div class="field" style="margin-top:10px;"><label>Gemini API Key</label><input type="text" id="g_gemini" value="${s.geminiKey||''}" placeholder="AIzaSy..."></div>
      <button class="ghost-btn" onclick="saveGeminiKey()">儲存 Gemini Key</button>
    </div>`;
  } else if(settingsSection==='fees'){
    body = `
    <div class="card">
      <h2>手續費 / 稅金設定</h2>
      <div class="hint">直接填你來回一趟實際會扣的「單邊」金額就好，不用算比例。例如來回總共扣 30 元手續費、18 元交易稅，這裡就填單邊手續費 15、單邊交易稅 9（程式會自動 ×2 算進出兩邊）。</div>
      <div class="grid3" style="margin-top:12px;">
        <div class="field"><label>手續費(每口/單邊,元)</label><input type="number" id="g_fee" value="${s.feePerSide}"></div>
        <div class="field"><label>交易稅(每口/單邊,元)</label><input type="number" id="g_tax" value="${s.taxPerSide}"></div>
        <div class="field"><label>每點金額(元)</label><input type="number" id="g_mult" value="${s.multiplier}"></div>
      </div>
      <div class="hint">每點金額：微型台指 10 元；小型台指 50 元；台指期 200 元。</div>
      <button class="ghost-btn" onclick="saveFeeSettings()">儲存費用設定</button>
    </div>
    <div class="card">
      <h2>🎯 期貨保證金 / 目標</h2>
      <div class="hint">用來在「期貨紀錄」算風險指標和目標達成度。原始/維持保證金請填「每口」的金額（可到期交所或你的券商查詢當月數字）。</div>
      <div class="grid3" style="margin-top:10px;">
        <div class="field"><label>原始保證金(每口)</label><input type="number" id="g_margin_init" value="${s.marginInit||0}"></div>
        <div class="field"><label>維持保證金(每口)</label><input type="number" id="g_margin_maintain" value="${s.marginMaintain||0}"></div>
        <div class="field"><label>本月獲利目標(元)</label><input type="number" id="g_futures_goal" value="${s.futuresGoal||0}"></div>
      </div>
      <button class="ghost-btn" onclick="saveMarginSettings()">儲存保證金/目標設定</button>
    </div>`;
  } else if(settingsSection==='links'){
    body = renderLinksSettingsSection();
  } else if(settingsSection==='backup'){
    body = `
    <div class="card">
      <h2>資料備份</h2>
      <div class="btnrow">
        <button class="ghost-btn" onclick="exportExcel()">📊 匯出 Excel 報表</button>
        <button class="ghost-btn" onclick="exportJson()">匯出 JSON</button>
        <button class="ghost-btn danger-btn" onclick="clearAll()">清空所有資料</button>
      </div>
    </div>`;
  }
  return sectionTabs + body;
}
function hasLocalData(){
  return (state.trades.length + state.stockTrades.length + state.marketData.length +
          state.plans.length + state.sentiment.length + state.checklistLog.length +
          state.stockCashLedger.length) > 0;
}
function remoteHasData(remoteData){
  if(!remoteData) return false;
  const c = k => (remoteData[k]||[]).length;
  return (c('trades')+c('stockTrades')+c('marketData')+c('plans')+c('sentiment')+c('checklistLog')+c('stockCashLedger')) > 0;
}
async function saveSettings(){
  state.settings = {
    ...state.settings,
    token: document.getElementById('g_token').value.trim(),
    owner: document.getElementById('g_owner').value.trim(),
    repo: document.getElementById('g_repo').value.trim(),
    path: document.getElementById('g_path').value.trim() || 'data.json',
    branch: document.getElementById('g_branch').value.trim() || 'main'
  };
  saveLocal();
  toast('設定已儲存');

  if(!ghConfigured()) return;
  setSyncStatus('busy', '檢查雲端資料中…');
  try{
    const remote = await ghGet();
    const remoteFull = remote && remoteHasData(remote.data);
    const localFull = hasLocalData();
    if(remoteFull){
      // 雲端已經有資料：以雲端為準（多裝置情境，雲端是最新的共同資料）
      await pullFromGithub(true);
    } else if(localFull){
      // 雲端是空的，但這台裝置本機有資料：把本機資料推上去，不要被空資料蓋掉
      state.meta.sha = remote ? remote.sha : null;
      await pushToGithub();
      toast('已把本機資料上傳到雲端');
    } else {
      setSyncStatus('', '雲端尚無資料');
    }
  }catch(e){
    console.error(e);
    setSyncStatus('err', '檢查失敗：'+e.message);
  }
}
function saveAppTitle(){
  state.settings.appTitle = document.getElementById('g_apptitle').value.trim() || '台指交易日誌';
  markDirty();
  toast('名稱已儲存');
}
function saveGeminiKey(){
  state.settings.geminiKey = document.getElementById('g_gemini').value.trim();
  saveLocal();
  toast('Gemini Key 已儲存');
}
function saveFeeSettings(){
  state.settings.feePerSide = num(document.getElementById('g_fee').value) || 0;
  state.settings.taxPerSide = num(document.getElementById('g_tax').value) || 0;
  state.settings.multiplier = num(document.getElementById('g_mult').value) || 10;
  markDirty(); toast('費用設定已儲存');
}
function saveMarginSettings(){
  state.settings.marginInit = num(document.getElementById('g_margin_init').value) || 0;
  state.settings.marginMaintain = num(document.getElementById('g_margin_maintain').value) || 0;
  state.settings.futuresGoal = num(document.getElementById('g_futures_goal').value) || 0;
  markDirty(); toast('保證金/目標設定已儲存');
}
function futuresBalanceAsOf(dateStr){
  const initial = state.settings.futuresCapital || 0;
  const ledgerNet = state.futuresCashLedger.filter(l=>l.date<=dateStr)
    .reduce((s,l)=> s + (l.type==='入金'?l.amount:-l.amount), 0);
  const tradesNet = state.trades.filter(t=>!isTradeOpen(t) && t.date<=dateStr)
    .reduce((s,t)=>s+tradeNetAmount(t),0);
  return initial + ledgerNet + tradesNet;
}
function saveFuturesCapital(){
  state.settings.futuresCapital = num(document.getElementById('fc_capital').value) || 0;
  markDirty(); toast('已儲存起始資金');
}
function addFuturesLedger(){
  const type = document.querySelector('[data-f="fl_type"].gold-on')?.dataset.v || '入金';
  const amount = num(document.getElementById('fl_amount').value);
  if(amount===null){ toast('請輸入金額'); return; }
  state.futuresCashLedger.push({
    id:uid(), type, date: document.getElementById('fl_date').value,
    amount, note: document.getElementById('fl_note').value
  });
  markDirty(); toast('已新增紀錄');
}
function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel 元件載入失敗，請檢查網路連線'); return; }
  const wb = XLSX.utils.book_new();

  const futuresRows = state.trades.map(t=>({
    日期:t.date, 盤別:t.session, 方向:t.direction, 順逆勢:t.trend, 上一盤狀態:t.prevState, 下單方式:t.orderType,
    進場點位:(t.entries||[]).map(e=>e.price).join(','), 進場口數:(t.entries||[]).map(e=>e.qty).join(','),
    出場點位:(t.exits||[]).map(e=>e.price).join(','), 出場口數:(t.exits||[]).map(e=>e.qty).join(','),
    毛利點數:Math.round(tradePoints(t)), 手續費稅金:Math.round(tradeCost(t)), 淨損益:Math.round(tradeNetAmount(t)),
    備註:t.note
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(futuresRows), '期貨紀錄');

  const stockRows = state.stockTrades.map(t=>{
    const exits = getExitLots(t);
    const soldQty = stockSoldQty(t);
    const avgExit = soldQty? (exits.reduce((s,l)=>s+l.price*l.qty,0)/soldQty) : null;
    return {
      帳戶:t.account, 代號:t.code, 名稱:t.name, 方向:t.direction,
      進場日期:t.entryDate, 進場均價:t.entryPrice, 進場股數:t.entryQty, 進場手續費:t.entryFee,
      已賣出股數:soldQty||0, 賣出均價:avgExit, 剩餘股數:stockRemainingQty(t),
      狀態: stockIsOpen(t)?'持有中':'已賣出',
      損益:stockProfit(t)===null?'':Math.round(stockProfit(t)), 備註:t.note
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockRows), '股票紀錄');

  const ledgerRows = state.stockCashLedger.map(l=>({ 帳戶:l.account, 日期:l.date, 類型:l.type, 金額:l.amount, 備註:l.note }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ledgerRows), '股票資金異動');

  const dataRows = state.marketData.map(d=>({
    日期:d.date, 盤別:d.session, 正逆價差:d.spread, VIX:d.vix, 外資淨口數:d.foreign, 收盤:d.close, 振幅:d.range
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataRows), '市場數據');

  const planRows = state.plans.map(p=>({
    日期:p.date, 盤別:p.session, 操作方向:(p.directions||[]).join('、'), 前盤形態:p.pattern,
    關鍵轉折點:p.keyLevel, 上方關卡:(p.upLevels||[]).map(l=>l.price).join('、'), 下方關卡:(p.downLevels||[]).map(l=>l.price).join('、'),
    備註:p.note, 盤後開高低收: p.review?`${p.review.open}/${p.review.high}/${p.review.low}/${p.review.close}`:'',
    複盤符合:(p.review&&p.review.matched||[]).join('、')
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planRows), '盤前規劃');

  XLSX.writeFile(wb, `交易日誌_${todayStr()}.xlsx`);
  toast('已匯出 Excel');
}
function exportJson(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trading-journal-backup.json';
  a.click();
}
let clearArmed = false;
function clearAll(){
  const btn = event.target;
  if(!clearArmed){
    clearArmed = true;
    btn.textContent = '再按一次確認清空';
    setTimeout(()=>{ clearArmed=false; btn.textContent='清空所有資料'; }, 3000);
    return;
  }
  clearArmed = false;
  const settings = state.settings, sha = state.meta.sha;
  state = defaultState();
  state.settings = settings; state.meta.sha = sha;
  saveLocal(); render(); toast('已清空');
}

/* ---------------- shared helpers ---------------- */
function pick(el){
  const field = el.dataset.f;
  document.querySelectorAll(`[data-f="${field}"]`).forEach(e=>e.classList.remove('gold-on','red-on','green-on'));
  el.classList.add(el.dataset.v==='多' ? 'red-on' : el.dataset.v==='空' ? 'green-on' : 'gold-on');
}
function toggleChip(el){ el.classList.toggle('gold-on'); }
function delItem(coll, id, el){
  if(el && el.dataset.armed==='1'){
    state[coll] = state[coll].filter(x=>x.id!==id);
    markDirty();
    toast('已刪除');
    return;
  }
  if(el){
    el.dataset.armed='1';
    el.dataset.orig = el.textContent;
    el.textContent = '再點一次刪除';
    el.style.color = '#fff';
    el.style.background = 'var(--red)';
    el.style.borderRadius = '6px';
    el.style.padding = '2px 8px';
    clearTimeout(el._t);
    el._t = setTimeout(()=>{
      if(!el.isConnected) return;
      el.dataset.armed='';
      el.textContent = el.dataset.orig;
      el.style.color=''; el.style.background=''; el.style.padding='';
    }, 3000);
  } else {
    state[coll] = state[coll].filter(x=>x.id!==id);
    markDirty();
    toast('已刪除');
  }
}
function historyDates(list){
  return [...new Set(list.map(e=>e.date))].filter(Boolean).sort((a,b)=>b.localeCompare(a));
}
function limitedHistory(list, dateFilter){
  if(dateFilter) return list.filter(e=>e.date===dateFilter);
  return list.slice(0,3);
}
function dateJumpPicker(list, currentValue, onChangeFnName){
  const dates = historyDates(list);
  if(!dates.length) return '';
  return `<div class="field"><label>選擇日期查看</label>
    <select onchange="${onChangeFnName}(this.value)">
      <option value="">最近 3 筆</option>
      ${dates.map(d=>`<option value="${d}" ${currentValue===d?'selected':''}>${d}</option>`).join('')}
    </select>
  </div>`;
}
function showImageModal(src){
  let modal = document.getElementById('imgModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'imgModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;';
    modal.onclick = ()=>{ modal.style.display='none'; };
    document.body.appendChild(modal);
  }
  modal.innerHTML = `<img src="${src}" style="max-width:100%;max-height:100%;border-radius:8px;">`;
  modal.style.display = 'flex';
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderNoteText(raw){
  let html = escapeHtml(raw);
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  html = html.replace(/\{\{(red|green|gold|blue|big):(.+?)\}\}/g, (m,c,t)=>{
    if(c==='big') return `<span style="font-size:1.25em;font-weight:700;">${t}</span>`;
    const colorMap = {red:'var(--red)', green:'var(--green)', gold:'var(--gold)', blue:'var(--cyan)'};
    return `<span style="color:${colorMap[c]}">${t}</span>`;
  });
  return html;
}
function wrapSelection(id, before, after){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart, end = el.selectionEnd;
  const val = el.value;
  const selected = val.slice(start,end) || '文字';
  el.value = val.slice(0,start) + before + selected + after + val.slice(end);
  el.focus();
  el.selectionStart = start + before.length;
  el.selectionEnd = start + before.length + selected.length;
}
function noteToolbar(targetId){
  return `<div class="btnrow" style="margin-bottom:6px;">
    <div class="chip" onclick="wrapSelection('${targetId}','**','**')" style="font-weight:700;">B 粗體</div>
    <div class="chip" onclick="wrapSelection('${targetId}','{{red:','}}')" style="color:var(--red);">🔴 紅</div>
    <div class="chip" onclick="wrapSelection('${targetId}','{{green:','}}')" style="color:var(--green);">🟢 綠</div>
    <div class="chip" onclick="wrapSelection('${targetId}','{{gold:','}}')" style="color:var(--gold);">🟡 黃</div>
    <div class="chip" onclick="wrapSelection('${targetId}','{{blue:','}}')" style="color:var(--cyan);">🔵 藍</div>
    <div class="chip" onclick="wrapSelection('${targetId}','{{big:','}}')">🔠 放大</div>
  </div>`;
}

const THEMES = {
  gold:   { name:'金色（預設）', gold:'#d4a53d', dim:'#3a3220' },
  blue:   { name:'藍色',         gold:'#4a90d9', dim:'#1c2b3a' },
  green:  { name:'綠色',         gold:'#3fae6a', dim:'#173325' },
  purple: { name:'紫色',         gold:'#9b6fd1', dim:'#2a2038' },
  red:    { name:'紅色',         gold:'#d1595f', dim:'#3a2020' },
  teal:   { name:'青色',         gold:'#3fb8b0', dim:'#173432' },
};
function applyTheme(key){
  const t = THEMES[key] || THEMES.gold;
  document.documentElement.style.setProperty('--gold', t.gold);
  document.documentElement.style.setProperty('--gold-dim', t.dim);
}
function setTheme(key){
  state.settings.theme = key;
  applyTheme(key);
  markDirty();
}
function applyMode(mode){
  document.body.classList.toggle('light', mode==='light');
}
function setMode(mode){
  state.settings.mode = mode;
  applyMode(mode);
  markDirty();
}
function bindTabEvents(){}

/* ---------------- init ---------------- */
applyTheme(state.settings.theme);
applyMode(state.settings.mode);
render();
if(ghConfigured()) pullFromGithub(true);
</script>
