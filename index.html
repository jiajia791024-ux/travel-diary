<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的生活手記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg-app:#FFF8EF;
  --ink:#4A3F35;
  --ink-soft:#94897A;
  --white:#FFFFFF;
  --shadow:rgba(74,63,53,.16);

  --travel-accent:#FF9B6A; --travel-accent-dark:#E2703A; --travel-bg:#FFE9D9; --travel-bg-2:#FFF4EB;
  --diary-accent:#6FA8DC;  --diary-accent-dark:#4A85BB;  --diary-bg:#E8F2FC;  --diary-bg-2:#F3F9FE;
  --recipe-accent:#8FC17E; --recipe-accent-dark:#5F9C4E; --recipe-bg:#EAF7E4; --recipe-bg-2:#F4FBF0;
  --book-accent:#C98BC9;   --book-accent-dark:#A15FA1;   --book-bg:#F6EAF8;   --book-bg-2:#FBF2FC;

  --status-planning-bg:#FFE3C2; --status-planning-fg:#B5651D;
  --status-soon-bg:#FFD6D6;     --status-soon-fg:#C0392B;
  --status-done-bg:#D9F2D2;     --status-done-fg:#3C7A3C;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans TC', sans-serif;
  color:var(--ink);
  background:var(--bg-app);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:'Noto Sans TC', sans-serif;}
h1,h2,h3{margin:0;font-weight:400;}
.hidden{display:none !important;}
:focus-visible{outline:3px solid #E2703A; outline-offset:2px;}
a{color:inherit;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

.brush{ font-family:'ZCOOL KuaiLe', cursive; font-weight:400; }

/* ============ HOME ============ */
#view-home{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  padding-bottom:3rem;
  background:var(--bg-app);
}
#view-home::before, #view-home::after{
  content:""; position:absolute; border-radius:50%; filter:blur(2px); z-index:0;
}
#view-home::before{ width:340px; height:340px; background:var(--travel-bg); top:-120px; left:-100px; opacity:.7; }
#view-home::after{ width:260px; height:260px; background:var(--book-bg); bottom:-80px; right:-60px; opacity:.7; }
.home-header{ position:relative; z-index:1; text-align:center; padding:4rem 1.5rem .5rem; }
.home-header h1{ font-size:clamp(2.2rem, 7vw, 3.1rem); color:var(--ink); }
.home-header p{ font-size:1.05rem; color:var(--ink-soft); margin-top:.6rem; }

.desk-items{
  position:relative; z-index:1;
  display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch;
  gap:1.6rem; padding:2.5rem 1.5rem 4rem; max-width:900px; margin:0 auto;
}
.desk-item{
  width:190px; border:3px solid transparent; border-radius:26px;
  background:var(--white);
  padding:1.6rem 1.1rem 1.3rem;
  display:flex; flex-direction:column; align-items:center; gap:.55rem;
  box-shadow:0 8px 0 var(--shadow), 0 10px 18px var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease;
}
.desk-item:hover, .desk-item:focus-visible{ transform:translateY(-6px) scale(1.03); }
.desk-item .badge{
  width:70px; height:70px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:2.1rem;
}
.desk-item .d-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.35rem; }
.desk-item .d-tag{ font-size:.85rem; color:var(--ink-soft); text-align:center; }
.desk-item.i-travel{ border-color:var(--travel-accent); }
.desk-item.i-travel .badge{ background:var(--travel-bg); }
.desk-item.i-diary{ border-color:var(--diary-accent); }
.desk-item.i-diary .badge{ background:var(--diary-bg); }
.desk-item.i-recipes{ border-color:var(--recipe-accent); }
.desk-item.i-recipes .badge{ background:var(--recipe-bg); }
.desk-item.i-books{ border-color:var(--book-accent); }
.desk-item.i-books .badge{ background:var(--book-bg); }

/* ============ shared module chrome ============ */
.module-view{ min-height:100vh; padding-bottom:4rem; }
.module-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap; padding:2rem 1.5rem 1rem; max-width:820px; margin:0 auto; }
.back-link{ border:none; background:none; font-size:.92rem; padding:0; color:var(--ink-soft); cursor:pointer; }
.back-link:hover{ text-decoration:underline; }
.module-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:2rem; margin-top:.3rem; }
.module-sub{ font-size:.95rem; color:var(--ink-soft); margin-top:.15rem; }
.module-body{ max-width:820px; margin:0 auto; padding:0 1.5rem; }

.btn{ border:none; border-radius:999px; padding:.62rem 1.25rem; font-size:.92rem; font-weight:700; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.15); }
.btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
.btn-sm{ padding:.4rem .9rem; font-size:.85rem; }
.btn-ghost{ background:var(--white); color:var(--ink-soft); border:2px solid #e6ddce; box-shadow:none; }
.btn-danger{ background:#E2703A; }
.icon-btn{ border:none; background:var(--white); border-radius:50%; width:2.1rem; height:2.1rem; box-shadow:0 2px 6px var(--shadow); font-size:1rem; }
.tiny-link{ border:none; background:none; font-size:.82rem; color:var(--ink-soft); text-decoration:underline; padding:.2rem 0; }
.tiny-link-danger{ color:#C0392B; }
.tiny-x{ border:none; background:none; color:#C0392B; font-size:.85rem; padding:0 .3rem; }

.field{ margin-bottom:.9rem; }
.field label{ display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:.25rem; font-weight:500; }
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=datetime-local], .field input[type=number], .field textarea, .field select{
  width:100%; border:2px solid #ecdfc9; border-radius:12px; background:var(--white); padding:.55rem .7rem; font-size:.95rem; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:4rem; line-height:1.6; }
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--travel-accent); }
.checkbox-field label{ display:flex; align-items:center; gap:.4rem; font-size:.9rem; color:var(--ink); }
.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:.9rem; }
.row-3-icons{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.6rem; }
.row-3-icons input{ text-align:center; }
@media (max-width:480px){ .row-2{grid-template-columns:1fr;} }

.form-panel{ background:var(--white); border-radius:18px; padding:1.2rem 1.2rem 1rem; margin-bottom:1.2rem; box-shadow:0 4px 14px var(--shadow); }
.form-actions{ display:flex; gap:.6rem; margin-top:.4rem; flex-wrap:wrap; }
.img-preview{ display:block; margin-top:.5rem; max-height:100px; border-radius:10px; }

.empty-state{ font-size:1.05rem; color:var(--ink-soft); text-align:center; padding:2.6rem 1rem; }
.loading-msg{ text-align:center; padding:2.2rem 1rem; color:var(--ink-soft); }

/* module backgrounds/colors */
#view-travel{ background:var(--travel-bg-2); } #view-travel .module-title, #view-travel .back-link{ color:var(--travel-accent-dark); } #view-travel .btn-primary{ background:var(--travel-accent); }
#view-diary{  background:var(--diary-bg-2); }  #view-diary  .module-title, #view-diary  .back-link{ color:var(--diary-accent-dark); }  #view-diary  .btn-primary{ background:var(--diary-accent); }
#view-recipes{background:var(--recipe-bg-2);}  #view-recipes.module-title{}
#view-recipes .module-title, #view-recipes .back-link{ color:var(--recipe-accent-dark); } #view-recipes .btn-primary{ background:var(--recipe-accent); }
#view-books{  background:var(--book-bg-2); }   #view-books  .module-title, #view-books  .back-link{ color:var(--book-accent-dark); }  #view-books  .btn-primary{ background:var(--book-accent); }

/* ---------- Travel: trip list ---------- */
.trip-card{ background:var(--white); border-radius:20px; padding:1.1rem 1.2rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); cursor:pointer; transition:transform .15s ease; }
.trip-card:hover{ transform:translateY(-3px); }
.trip-card-top{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; }
.trip-card-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.3rem; }
.trip-status-badge{ font-size:.75rem; font-weight:700; padding:.2rem .65rem; border-radius:999px; }
.status-planning{ background:var(--status-planning-bg); color:var(--status-planning-fg); }
.status-soon{ background:var(--status-soon-bg); color:var(--status-soon-fg); }
.status-done{ background:var(--status-done-bg); color:var(--status-done-fg); }
.trip-card-dest{ color:var(--ink-soft); margin-top:.2rem; font-size:.92rem; }
.trip-card-range{ font-size:.85rem; color:var(--ink-soft); margin-top:.3rem; }
.trip-card-stats{ display:flex; gap:1rem; margin-top:.55rem; font-size:.85rem; color:var(--travel-accent-dark); font-weight:600; flex-wrap:wrap; }

/* ---------- Travel: workspace ---------- */
.ws-title-row{ display:flex; align-items:center; gap:.6rem; margin-top:.3rem; flex-wrap:wrap; }
.ws-meta-row{ display:flex; gap:.9rem; align-items:center; margin-top:.4rem; font-size:.88rem; color:var(--ink-soft); flex-wrap:wrap; }
.subtabs{ display:flex; gap:.5rem; flex-wrap:wrap; padding:0 1.5rem 1rem; max-width:820px; margin:0 auto; }
.subtab-pill{ border:2px solid var(--travel-accent); background:var(--white); color:var(--travel-accent-dark); border-radius:999px; padding:.45rem 1rem; font-size:.88rem; font-weight:600; }
.subtab-pill-active{ background:var(--travel-accent); color:#fff; }
.subtab-h{ font-weight:700; font-size:.95rem; color:var(--travel-accent-dark); margin:0 0 .5rem; }
.flight-block{ background:var(--white); border-radius:18px; padding:1.1rem 1.2rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); }

.day-card{ background:var(--white); border-radius:18px; padding:1rem 1.1rem 1.1rem; margin-bottom:1.1rem; box-shadow:0 4px 12px var(--shadow); }
.day-card-head{ cursor:pointer; }
.day-card-head-top{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
.day-card-head-main{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; }
.day-date{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.15rem; color:var(--travel-accent-dark); }
.day-stay{ font-size:.85rem; color:var(--ink-soft); }
.day-title{ font-size:.9rem; color:var(--ink-soft); margin-top:.3rem; }
.day-expand-arrow{ font-size:.78rem; color:var(--travel-accent-dark); font-weight:600; white-space:nowrap; }
.day-edit-link{ margin-top:.4rem; display:inline-block; }

.itinerary-track{ margin-top:.7rem; }
.transit-connector{ display:flex; gap:.4rem; align-items:center; font-size:.8rem; color:var(--ink-soft); padding:.3rem 0 .3rem 30px; margin-left:13px; border-left:2px dashed #eadfc9; }
.item-card{ display:flex; gap:.7rem; padding:.65rem 0; }
.item-num{ flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--travel-accent); color:#fff; font-size:.78rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:.1rem; }
.item-thumb-sq{ width:60px; height:60px; object-fit:cover; border-radius:12px; flex-shrink:0; display:block; cursor:zoom-in; }
.item-thumb-placeholder{ width:60px; height:60px; border-radius:12px; background:var(--travel-bg); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
.item-card-body{ flex:1; min-width:0; }
.item-card-top{ display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; }
.item-time{ font-weight:700; color:var(--travel-accent-dark); font-size:.86rem; }
.item-place{ font-weight:700; font-size:.98rem; }
.item-badge{ font-size:.72rem; background:var(--status-soon-bg); color:var(--status-soon-fg); border-radius:999px; padding:.1rem .5rem; }
.item-stay-badge{ font-size:.72rem; background:var(--travel-bg); color:var(--travel-accent-dark); border-radius:999px; padding:.1rem .55rem; font-weight:600; }
.item-card-sub{ display:flex; gap:.7rem; font-size:.8rem; color:var(--ink-soft); margin-top:.25rem; flex-wrap:wrap; align-items:center; }
.item-card-sub a{ text-decoration:underline; }
.item-note{ font-size:.83rem; color:var(--ink-soft); margin-top:.3rem; white-space:pre-wrap; }

.transport-picker{ display:flex; flex-wrap:wrap; gap:.4rem; }
.transport-pick{ border:2px solid #ecdfc9; background:var(--white); border-radius:14px; padding:.35rem .5rem; font-size:1.05rem; text-align:center; min-width:52px; }
.transport-pick span{ display:block; font-size:.62rem; color:var(--ink-soft); margin-top:.1rem; }
.transport-pick-active{ border-color:var(--travel-accent); background:var(--travel-bg); }

.checklist-pills{ display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
.pill{ border:2px solid var(--travel-accent); background:var(--white); color:var(--travel-accent-dark); border-radius:999px; padding:.4rem .9rem; font-size:.85rem; font-weight:600; }
.pill-active{ background:var(--travel-accent); color:#fff; }
#view-books .pill{ border-color:var(--book-accent); color:var(--book-accent-dark); }
#view-books .pill-active{ background:var(--book-accent); color:#fff; }
#view-recipes .pill{ border-color:var(--recipe-accent); color:var(--recipe-accent-dark); }
#view-recipes .pill-active{ background:var(--recipe-accent); color:#fff; }
.recipe-badges{ display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-top:.3rem; }
.pill-add{ border-style:dashed; }
.checklist-panel{ background:var(--white); border-radius:18px; padding:1.1rem 1.2rem; box-shadow:0 4px 12px var(--shadow); }
.checklist-panel-head{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; margin-bottom:.5rem; }
.checklist-name{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.15rem; }
.checklist-progress{ font-size:.82rem; color:var(--ink-soft); }
.checklist-items{ display:flex; flex-direction:column; gap:.3rem; }
.checklist-item{ display:flex; align-items:center; gap:.5rem; font-size:.93rem; padding:.3rem 0; flex-wrap:wrap; }
.checklist-item input{ width:18px; height:18px; accent-color:var(--travel-accent); }
.checklist-item.is-done span{ text-decoration:line-through; color:var(--ink-soft); }
.checklist-item span{ flex:1; min-width:80px; }
.checklist-add-row{ display:flex; gap:.5rem; margin-top:.7rem; }
.checklist-add-row input{ flex:1; border:2px solid #ecdfc9; border-radius:12px; padding:.5rem .7rem; }
.day-link-select{ flex:none; font-size:.75rem; border:1px solid #ecdfc9; border-radius:8px; padding:.2rem .3rem; background:var(--white); color:var(--ink-soft); max-width:120px; }
.checklist-item-thumb{ width:28px; height:28px; object-fit:cover; border-radius:6px; flex-shrink:0; cursor:zoom-in; }
.tiny-icon-btn{ border:none; background:none; font-size:.95rem; padding:0 .2rem; flex-shrink:0; line-height:1; }
.day-link-tag{ flex:none !important; font-size:.72rem; background:var(--travel-bg); color:var(--travel-accent-dark); border-radius:999px; padding:.1rem .55rem; font-weight:600; text-decoration:none !important; }
.day-checklist-block{ margin-top:.8rem; padding-top:.6rem; border-top:1px dashed #eee0cc; }

.moment-card{ background:var(--white); border-radius:18px; padding:1rem 1.1rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); }
.moment-date{ font-size:.82rem; color:var(--travel-accent-dark); font-weight:600; margin-bottom:.4rem; }
.moment-photo{ display:block; max-height:220px; border-radius:14px; margin-bottom:.6rem; cursor:zoom-in; }
.moment-text{ font-size:.95rem; line-height:1.7; white-space:pre-wrap; }

.expense-total{ text-align:center; background:var(--white); border-radius:18px; padding:1.3rem 1rem; margin-bottom:1.1rem; box-shadow:0 4px 12px var(--shadow); font-size:.95rem; color:var(--ink-soft); }
.expense-total-num{ font-family:'ZCOOL KuaiLe',cursive; font-size:2rem; color:var(--travel-accent-dark); }
.expense-daylist, .expense-itemlist{ background:var(--white); border-radius:18px; padding:.5rem 1.1rem; box-shadow:0 4px 12px var(--shadow); }
.expense-day-row{ display:flex; justify-content:space-between; padding:.55rem 0; font-size:.9rem; border-top:1px dashed #eee0cc; }
.expense-item-row{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap; padding:.55rem 0; font-size:.9rem; border-top:1px dashed #eee0cc; }
.expense-day-row:first-child, .expense-item-row:first-child{ border-top:none; }
.expense-item-row .ex-amount{ font-weight:700; color:var(--travel-accent-dark); }
.expense-currency-totals{ display:flex; flex-direction:column; gap:.2rem; }

.modal-overlay{ position:fixed; inset:0; background:rgba(50,40,30,.42); display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem; }
.modal-box{ background:var(--white); border-radius:22px; padding:1.4rem; max-width:420px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 12px 30px rgba(0,0,0,.25); }
.modal-box-wide{ max-width:480px; }
.lightbox-overlay{ background:rgba(20,15,10,.82); padding:2rem 1rem; z-index:150; cursor:zoom-out; }
.lightbox-img{ max-width:94vw; max-height:90vh; border-radius:12px; display:block; box-shadow:0 10px 30px rgba(0,0,0,.4); }

.sync-status-badge{ position:fixed; top:14px; right:14px; z-index:60; display:flex; align-items:center; gap:.4rem; background:var(--white); border-radius:999px; padding:.45rem .85rem; box-shadow:0 4px 10px var(--shadow); font-size:.78rem; color:var(--ink-soft); cursor:pointer; border:none; font-family:'Noto Sans TC',sans-serif; }
.sync-dot{ width:8px; height:8px; border-radius:50%; background:#ccc; flex-shrink:0; }
.sync-dot.ok{ background:#4caf50; }
.sync-dot.warn{ background:#e0a32e; }
.sync-dot.err{ background:#c0392b; }
.sync-version{ color:#bbb; font-size:.7rem; }
.sync-banner{ position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:70; background:var(--white); border-radius:999px; padding:.5rem 1.1rem; font-size:.8rem; box-shadow:0 4px 10px var(--shadow); color:var(--ink-soft); max-width:80vw; text-align:center; }
.settings-section{ margin-bottom:1.2rem; padding-bottom:1.1rem; border-bottom:1px dashed #eee0cc; }
.settings-section:last-of-type{ border-bottom:none; margin-bottom:.4rem; padding-bottom:0; }
.settings-section-title{ font-weight:700; margin-bottom:.4rem; font-size:1rem; }
.settings-hint{ font-size:.8rem; color:var(--ink-soft); margin:0 0 .7rem; line-height:1.6; }
.settings-status{ font-size:.82rem; color:var(--ink-soft); margin:.6rem 0 0; }
.settings-status-msg{ color:var(--travel-accent-dark); font-weight:600; }

/* ---------- Diary (calendar) ---------- */
.cal-header{ display:flex; align-items:center; justify-content:center; gap:1.2rem; margin-bottom:.8rem; }
.cal-title{ font-size:1.35rem; color:var(--diary-accent-dark); min-width:8rem; text-align:center; }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:.72rem; color:var(--ink-soft); margin-bottom:.35rem; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-cell{ position:relative; aspect-ratio:1; border:none; background:var(--white); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:1px; padding:5px 2px 2px; box-shadow:0 2px 6px var(--shadow); font-family:'Noto Sans TC',sans-serif; }
.cal-cell-empty{ background:transparent; box-shadow:none; }
.cal-daynum{ font-size:.75rem; color:var(--ink-soft); }
.cal-cell.has-entry .cal-daynum{ color:var(--diary-accent-dark); font-weight:700; }
.cal-cell.is-today{ box-shadow:0 0 0 2px var(--diary-accent) inset, 0 2px 6px var(--shadow); }
.cal-cell.is-selected{ outline:2px solid var(--diary-accent-dark); outline-offset:1px; }
.cal-day-badge{ position:absolute; bottom:1px; font-size:.8rem; line-height:1; letter-spacing:-1px; max-width:100%; overflow:hidden; white-space:nowrap; }
.cal-symbols{ font-size:.68rem; line-height:1; white-space:nowrap; overflow:hidden; max-width:100%; }
.cal-detail-head{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; margin:1.1rem 0 .6rem; }
.diary-entry-date-title{ font-size:1.4rem; margin:.4rem 0 1rem; color:var(--diary-accent-dark); }
.diary-view-symbols{ font-size:1.6rem; margin-bottom:.5rem; }
.diary-view-title{ font-size:1.25rem; margin-bottom:.5rem; }
.diary-view-content{ font-size:.95rem; line-height:1.8; }
.rte-toolbar{ display:flex; gap:.4rem; align-items:center; margin-bottom:.4rem; flex-wrap:wrap; }
.rte-btn{ border:2px solid #ecdfc9; background:var(--white); border-radius:8px; width:32px; height:32px; font-size:.9rem; }
.rte-swatch{ width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #ddd; padding:0; }
.rte-swatch-reset{ background:var(--white) !important; color:var(--ink); font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center; }

/* ===================== helpers ===================== */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2)); }
function esc(str){ if(str===undefined||str===null) return ''; return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sanitizeHtml(html){
  if(!html) return '';
  return String(html).replace(/<script[\s\S]*?<\/script>/gi, '').replace(/ on\w+="[^"]*"/gi, '').replace(/ on\w+='[^']*'/gi, '');
}
function diaryContentToHtml(raw){
  if(!raw) return '';
  if(String(raw).indexOf('<') === -1) return esc(raw).replace(/\n/g, '<br>');
  return sanitizeHtml(raw);
}
function richExec(targetId, cmd, value){
  document.getElementById(targetId).focus();
  document.execCommand(cmd, false, value || null);
}
function richToolbarHtml(targetId){
  return `<div class="rte-toolbar">
    <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="richExec('${targetId}','bold')"><b>B</b></button>
    <button type="button" class="rte-swatch" style="background:#e74c3c" onmousedown="event.preventDefault()" onclick="richExec('${targetId}','foreColor','#e74c3c')" title="紅"></button>
    <button type="button" class="rte-swatch" style="background:#3498db" onmousedown="event.preventDefault()" onclick="richExec('${targetId}','foreColor','#3498db')" title="藍"></button>
    <button type="button" class="rte-swatch" style="background:#27ae60" onmousedown="event.preventDefault()" onclick="richExec('${targetId}','foreColor','#27ae60')" title="綠"></button>
    <button type="button" class="rte-swatch" style="background:#f1c40f" onmousedown="event.preventDefault()" onclick="richExec('${targetId}','foreColor','#f1c40f')" title="黃"></button>
    <button type="button" class="rte-swatch" style="background:#9b59b6" onmousedown="event.preventDefault()" onclick="richExec('${targetId}','foreColor','#9b59b6')" title="紫"></button>
    <button type="button" class="rte-swatch rte-swatch-reset" onmousedown="event.preventDefault()" onclick="richExec('${targetId}','removeFormat')">清除</button>
  </div>`;
}
function attrJson(obj){ return JSON.stringify(obj).replace(/&/g,'&amp;').replace(/'/g,'&#39;'); }
function val(id){ const el=document.getElementById(id); return el ? el.value : ''; }
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); if(p.length!==3) return d; return `${p[0]}/${parseInt(p[1],10)}/${parseInt(p[2],10)}`; }
function fmtDayLabel(d){ if(!d) return '尚未設定日期'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; const week=['日','一','二','三','四','五','六'][dt.getDay()]; return `${dt.getMonth()+1}/${dt.getDate()}（${week}）`; }
function stars(n){ n=parseInt(n,10)||0; return '★★★★★☆☆☆☆☆'.slice(5-n,10-n); }
function formatMoney(n){ if(n===undefined||n===null||isNaN(n)) return 'NT$ 0'; return 'NT$ ' + Math.round(n).toLocaleString('zh-TW'); }
function minutesLabel(m){ m=parseInt(m,10); if(isNaN(m)||m<=0) return ''; if(m<60) return m+'分'; const h=Math.floor(m/60), r=m%60; return h+'時'+(r?r+'分':''); }
function transitLabel(m){ m=parseInt(m,10); if(isNaN(m)||m<=0) return ''; if(m<60) return m+'分鐘'; const h=Math.floor(m/60), r=m%60; return h+'小時'+(r?r+'分鐘':''); }
function addMinutesToTime(timeStr, minutes){
  if(!timeStr) return '';
  const parts = timeStr.split(':');
  const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h) || isNaN(m)) return '';
  let total = ((h*60 + m + parseInt(minutes,10)) % 1440 + 1440) % 1440;
  const eh = Math.floor(total/60), em = total%60;
  return String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
}

/* ---- settings modal (GitHub sync + future settings) ---- */
function openSettingsModal(){
  document.getElementById('settings-modal-content').innerHTML = settingsModalHtml();
  document.getElementById('settings-modal-overlay').classList.remove('hidden');
}
function closeSettingsModal(){ document.getElementById('settings-modal-overlay').classList.add('hidden'); }
function settingsModalHtml(msg){
  const s = _appSettings;
  const connected = githubConfigured();
  const lastSync = s.lastSyncedAt ? new Date(s.lastSyncedAt).toLocaleString('zh-TW') : '尚未同步過';
  return `
    <h3 class="brush" style="font-size:1.3rem;margin-bottom:.6rem;">⚙️ 設定 <span style="font-family:'Noto Sans TC',sans-serif;font-size:.7rem;color:var(--ink-soft);">${APP_VERSION}</span></h3>
    <div class="settings-section">
      <div class="settings-section-title">☁️ GitHub 雲端同步</div>
      <p class="settings-hint">建議建立一個「私有」repo 專門存放資料檔（例如 travel-diary-data），並用只限該 repo 權限的 Fine-grained token。App 本身可以放在另一個公開 repo 上用 GitHub Pages 開啟。設定後每次打開網頁會自動先讀取最新資料，修改時也會自動同步上去；下面的按鈕可以手動再同步一次。這個功能要把檔案發佈成真正的網頁後才能用，Claude 的預覽視窗裡連不到 GitHub。</p>
      <div class="field"><label>Personal Access Token</label><input type="password" id="set-gh-token" value="${esc(s.githubToken)}" placeholder="github_pat_xxxxxxxxxxxx"></div>
      <div class="row-2">
        <div class="field"><label>帳號（owner）</label><input type="text" id="set-gh-owner" value="${esc(githubOwner())}" placeholder="yourname"></div>
        <div class="field"><label>資料 repo 名稱</label><input type="text" id="set-gh-repo-name" value="${esc(githubRepoName())}" placeholder="travel-diary-data"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>檔案路徑</label><input type="text" id="set-gh-path" value="${esc(s.githubPath || 'data.json')}" placeholder="data.json"></div>
        <div class="field"><label>分支</label><input type="text" id="set-gh-branch" value="${esc(githubBranch())}" placeholder="main"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveGithubSettings()">儲存設定</button>
        ${connected ? `<button class="btn btn-ghost" onclick="doPull()">↓ 從雲端讀取</button>
        <button class="btn btn-ghost" onclick="doPush()">↑ 立即同步</button>
        <button class="btn btn-ghost" onclick="disconnectGithub()">取消連結</button>` : ''}
      </div>
      ${connected ? `<div class="settings-status">✅ 已設定・上次同步：${esc(lastSync)}</div>` : ''}
      ${msg ? `<div class="settings-status settings-status-msg">${esc(msg)}</div>` : ''}
    </div>
    <div class="settings-section">
      <div class="settings-section-title">📊 匯出 Excel</div>
      <p class="settings-hint">即將推出。</p>
    </div>
    <div class="form-actions"><button class="btn btn-ghost" onclick="closeSettingsModal()">關閉</button></div>`;
}
async function saveGithubSettings(){
  _appSettings.githubToken = val('set-gh-token').trim();
  _appSettings.githubOwner = val('set-gh-owner').trim().replace(/^\/+|\/+$/g,'');
  _appSettings.githubRepoName = val('set-gh-repo-name').trim().replace(/^\/+|\/+$/g,'');
  _appSettings.githubPath = val('set-gh-path').trim() || 'data.json';
  _appSettings.githubBranch = val('set-gh-branch').trim() || 'main';
  delete _appSettings.githubOwnerRepo;
  await setAppSettings(_appSettings);
  updateSyncStatusBadge();
  document.getElementById('settings-modal-content').innerHTML = settingsModalHtml('設定已儲存。');
}
function disconnectGithub(){
  showConfirmModal('確定要取消 GitHub 同步連結嗎？（不會刪除 GitHub 上已經同步的資料，只是這台裝置不再自動同步）', async () => {
    _appSettings = {};
    await setAppSettings(_appSettings);
    _syncState = 'unset';
    updateSyncStatusBadge();
    document.getElementById('settings-modal-content').innerHTML = settingsModalHtml('已取消連結。');
  });
}
async function doPush(){
  document.getElementById('settings-modal-content').innerHTML = settingsModalHtml('同步中…');
  try{ await pushToGithub(); document.getElementById('settings-modal-content').innerHTML = settingsModalHtml('已上傳目前資料到 GitHub。'); }
  catch(e){ document.getElementById('settings-modal-content').innerHTML = settingsModalHtml('上傳失敗：' + e.message); }
}
async function doPull(){
  document.getElementById('settings-modal-content').innerHTML = settingsModalHtml('下載中…');
  try{ await pullFromGithub(); location.reload(); }
  catch(e){ document.getElementById('settings-modal-content').innerHTML = settingsModalHtml('下載失敗：' + e.message); }
}

function fileToDataURL(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    if(!file){ resolve(''); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===================== storage (window.storage when available, else localStorage; optional GitHub sync layer) ===================== */
const STORAGE_KEYS = { travel:'travel:entries', diary:'diary:entries', recipes:'recipes:entries', books:'books:entries' };
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage !== null);

async function localGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ const res = await window.storage.get(key, false); return res && res.value ? res.value : null; }
    catch(e){ return null; }
  }
  try{ return window.localStorage.getItem(key); } catch(e){ return null; }
}
async function localSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ return !!(await window.storage.set(key, value, false)); }
    catch(e){ return false; }
  }
  try{ window.localStorage.setItem(key, value); return true; } catch(e){ return false; }
}

async function loadEntries(moduleKey){
  const raw = await localGet(STORAGE_KEYS[moduleKey]);
  try{ return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
}
async function saveEntriesRaw(moduleKey, arr){ return await localSet(STORAGE_KEYS[moduleKey], JSON.stringify(arr)); }
async function saveEntries(moduleKey, arr){
  const ok = await saveEntriesRaw(moduleKey, arr);
  if(githubConfigured()) autoPushToGithub();
  return ok;
}

/* ---- app settings (GitHub sync config) ---- */
const SETTINGS_KEY = 'app:settings';
const APP_VERSION = 'v2.0';
let _appSettings = {};
let _syncState = 'unset'; // unset | ok | warn | err
async function getAppSettings(){
  const raw = await localGet(SETTINGS_KEY);
  try{ return raw ? JSON.parse(raw) : {}; } catch(e){ return {}; }
}
async function setAppSettings(settings){ await localSet(SETTINGS_KEY, JSON.stringify(settings)); }
function githubOwner(){ if(_appSettings.githubOwner) return _appSettings.githubOwner; if(_appSettings.githubOwnerRepo) return _appSettings.githubOwnerRepo.split('/')[0]; return ''; }
function githubRepoName(){ if(_appSettings.githubRepoName) return _appSettings.githubRepoName; if(_appSettings.githubOwnerRepo) return _appSettings.githubOwnerRepo.split('/')[1]; return ''; }
function githubBranch(){ return _appSettings.githubBranch || 'main'; }
function githubConfigured(){ return !!(_appSettings.githubToken && githubOwner() && githubRepoName() && _appSettings.githubPath); }

/* ---- GitHub Contents API helpers ---- */
function b64EncodeUnicode(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}
function b64DecodeUnicode(b64){
  const binary = atob(b64.replace(/\n/g,''));
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function githubApiUrl(){
  const pathParts = _appSettings.githubPath.split('/').map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${githubOwner()}/${githubRepoName()}/contents/${pathParts}`;
}
async function githubGetFile(){
  const res = await fetch(githubApiUrl() + '?ref=' + encodeURIComponent(githubBranch()), {
    headers: { 'Authorization': 'token ' + _appSettings.githubToken, 'Accept': 'application/vnd.github+json' },
    cache: 'no-store'
  });
  if(res.status === 404) return { notFound: true };
  if(!res.ok) throw new Error('GitHub 讀取失敗（' + res.status + '）');
  const json = await res.json();
  return { sha: json.sha, content: b64DecodeUnicode(json.content) };
}
async function githubPutFile(contentStr, sha, message){
  const body = { message: message || '同步生活手記資料', content: b64EncodeUnicode(contentStr), branch: githubBranch() };
  if(sha) body.sha = sha;
  const res = await fetch(githubApiUrl(), {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + _appSettings.githubToken, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const t = await res.text().catch(()=>'');
    const err = new Error('GitHub 寫入失敗（' + res.status + '）' + t.slice(0,150));
    err.status = res.status;
    throw err;
  }
  return await res.json();
}

/* ---- trip sharing (writes into the SAME repo that hosts this page, so it can be read back as a plain static file) ---- */
function currentRepoFromLocation(){
  const owner = location.hostname.split('.')[0];
  const pathParts = location.pathname.split('/').filter(Boolean);
  const repo = pathParts[0] || '';
  const base = repo ? `/${repo}/` : '/';
  return { owner, repo, base };
}
async function githubGetFileAtRepoPath(owner, repo, path){
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  const res = await fetch(url, { headers: { 'Authorization': 'token ' + _appSettings.githubToken, 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
  if(res.status === 404) return { notFound: true };
  if(!res.ok) throw new Error('讀取失敗（' + res.status + '）');
  const json = await res.json();
  return { sha: json.sha };
}
async function githubPutFileAtRepoPath(owner, repo, path, contentStr, sha, message){
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  const body = { message: message || '更新分享資料', content: b64EncodeUnicode(contentStr) };
  if(sha) body.sha = sha;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + _appSettings.githubToken, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error('寫入失敗（' + res.status + '）' + t.slice(0,150)); }
  return await res.json();
}

    return;
  }
  showShareOptionsModal(tripId);
}
function showShareOptionsModal(tripId){

  const inclExpenses = _appSettings.shareIncludeExpenses === true;
  document.getElementById('generic-modal-content').innerHTML = `

    <div class="field checkbox-field"><label><input type="checkbox" id="share-opt-checklists" ${inclChecklists?'checked':''}> 包含清單（行前/購物/美食清單的內容與完成狀態）</label></div>
    <div class="field checkbox-field"><label><input type="checkbox" id="share-opt-expenses" ${inclExpenses?'checked':''}> 包含花費總計（對方會看到你花了多少錢）</label></div>

async function confirmShareTrip(tripId){
  const inclChecklists = document.getElementById('share-opt-checklists').checked;
  const inclExpenses = document.getElementById('share-opt-expenses').checked;
  _appSettings.shareIncludeChecklists = inclChecklists;
  _appSettings.shareIncludeExpenses = inclExpenses;
  await setAppSettings(_appSettings);

  const trip = getCurrentTrip();
  const shareData = JSON.parse(JSON.stringify(trip));
  (shareData.days||[]).forEach(d => (d.items||[]).forEach(it => { delete it.image; }));
  (shareData.moments||[]).forEach(m => { delete m.photo; });
  if(!inclChecklists) delete shareData.checklists;
  if(!inclExpenses) delete shareData.expenses;

  const { owner, repo, base } = currentRepoFromLocation();
  const path = 'shares/' + tripId + '.json';
  try{
    let sha = null;
    const existing = await githubGetFileAtRepoPath(owner, repo, path);
    if(!existing.notFound) sha = existing.sha;
    await githubPutFileAtRepoPath(owner, repo, path, JSON.stringify(shareData), sha, '分享行程：' + trip.title);
    const shareUrl = location.origin + base + '?trip=' + encodeURIComponent(tripId);
    showShareLinkModal(shareUrl);
  }catch(e){
    showInfoModal('產生分享連結失敗：' + e.message + '。請確認你的 GitHub Token 也有「' + owner + '/' + repo + '」這個 repo 的讀寫權限（跟存資料用的 repo 可能不是同一個）。');
  }
}

  inp.select();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(inp.value).catch(()=>{}); }
  try{ document.execCommand('copy'); }catch(e){}
}
function renderSharedTrip(trip){
  document.querySelectorAll('#view-home, .module-view, .settings-gear-btn, .sync-status-badge').forEach(el => el.classList.add('hidden'));
  const view = document.getElementById('shared-view');
  view.classList.remove('hidden');
  const range = computeTripDateRange(trip);
  let html = `<div class="module-header"><div>
      <h2 class="module-title brush" style="margin:0;color:var(--travel-accent-dark);">🧳 ${esc(trip.title)}</h2>
      <p class="module-sub">${esc(trip.destination||'')}・📅 ${esc(range)}・唯讀分享頁面</p>
    </div></div><div class="module-body">`;

  const f = trip.flights || {};
  const legs = [['去程', f.outbound], ['回程', f.ret]].filter(([,x]) => x && (x.flightNo || x.from || x.to));
  if(legs.length){
    html += legs.map(([label, x]) => `<div class="flight-block"><b>${label}</b>　${esc(x.flightNo||'')}<br>${esc(x.from||'')} ${esc(x.departTime||'')} → ${esc(x.to||'')} ${esc(x.arriveTime||'')}</div>`).join('');
  }

  const days = [...(trip.days||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  html += days.map(day => {
    const items = [...(day.items||[])].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    let dayHtml = `<div class="day-card">
      <div class="day-card-head-main"><span class="day-date brush">📅 ${esc(fmtDayLabel(day.date))}</span>${day.stay?`<span class="day-stay">🏨 ${esc(day.stay)}</span>`:''}</div>
      ${day.title ? `<div class="day-title">🎯 ${esc(day.title)}</div>` : ''}
      <div class="itinerary-track">`;
    dayHtml += items.map((it,i) => {
      let row = '';
      if(it.transport || it.transitMinutes){
        row += `<div class="transit-connector"><span>${TRANSPORT_ICONS[it.transport]||'🚏'} ${esc(TRANSPORT_LABELS[it.transport]||'交通')}${it.transitMinutes?esc(transitLabel(it.transitMinutes)):''}</span></div>`;
      }
      const timeDisplay = it.time ? (it.stayMinutes ? `${it.time}-${addMinutesToTime(it.time, it.stayMinutes)}` : it.time) : '';
      row += `<div class="item-card">
        <span class="item-num">${i+1}</span>
        <span class="item-thumb-placeholder">${esc(itemIcon(it))}</span>
        <div class="item-card-body">
          <div class="item-card-top">${timeDisplay?`<span class="item-time">${esc(timeDisplay)}</span>`:''}<span class="item-place">${esc(itemIcon(it))} ${esc(it.place||'')}</span></div>
          <div class="item-card-sub">
            ${it.stayMinutes?`<span class="item-stay-badge">停留 ${esc(minutesLabel(it.stayMinutes))}</span>`:''}
            ${it.needReservation?'<span class="item-badge">🔖 需預約／購票</span>':''}
            ${it.mapLink?`<a href="${esc(it.mapLink)}" target="_blank" rel="noopener">📍 地圖</a>`:''}
          </div>
          ${it.note?`<div class="item-note">${esc(it.note)}</div>`:''}
        </div>
      </div>`;
      return row;
    }).join('');
    dayHtml += `</div></div>`;
    return dayHtml;
  }).join('');

  const moments = [...(trip.moments||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(moments.length){
    html += `<div class="subtab-h" style="margin-top:1.2rem;">📸 趣事</div>` + moments.map(m => `
      <div class="moment-card">${m.date?`<div class="moment-date">${esc(fmtDate(m.date))}</div>`:''}<div class="moment-text">${esc(m.text)}</div></div>`).join('');
  }

  const checklists = trip.checklists || [];
  if(checklists.length){
    html += `<div class="subtab-h" style="margin-top:1.2rem;">✅ 清單</div>` + checklists.map(l => {
      const done = l.items.filter(i=>i.done).length;
      return `<div class="checklist-panel" style="margin-bottom:1rem;">
        <div class="checklist-panel-head"><span class="checklist-name brush">${esc(l.name)}</span><span class="checklist-progress">${done}/${l.items.length}</span></div>
        <div class="checklist-items">${l.items.map(it => `<label class="checklist-item ${it.done?'is-done':''}"><input type="checkbox" disabled ${it.done?'checked':''}><span>${esc(it.text)}</span></label>`).join('')}</div>
      </div>`;
    }).join('');
  }

  const totals = computeExpenseTotalsByCurrency(trip);
  const currencyKeys = Object.keys(totals);
  if(currencyKeys.length){
    html += `<div class="subtab-h" style="margin-top:1.2rem;">💰 花費</div>
      <div class="expense-total"><div class="expense-currency-totals">` + currencyKeys.map(cur =>
        `<div>${esc(cur)} 總計　<span class="expense-total-num brush">${totals[cur].toLocaleString('zh-TW')}</span></div>`
      ).join('') + `</div></div>`;
  }

  html += `</div>`;
  view.innerHTML = html;
}
(async function checkSharedView(){
  const tripId = new URLSearchParams(location.search).get('trip');
  if(!tripId) return;
  const { owner, repo } = currentRepoFromLocation();
  try{
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/shares/${encodeURIComponent(tripId)}.json`;
    const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
    if(!res.ok) throw new Error('找不到這個分享連結');
    const json = await res.json();
    const trip = JSON.parse(b64DecodeUnicode(json.content));
    renderSharedTrip(trip);
  }catch(e){
    document.querySelectorAll('#view-home, .module-view').forEach(el => el.classList.add('hidden'));
    document.getElementById('shared-view').classList.remove('hidden');
    document.getElementById('shared-view').innerHTML = `<div class="module-body"><div class="empty-state">這個分享連結目前無法讀取，可能已經失效。</div></div>`;
  }
})();
async function buildFullSnapshot(){
  const travel = state.travel.entries !== null ? state.travel.entries : await loadEntries('travel');
  const diary = state.diary.entries !== null ? state.diary.entries : await loadEntries('diary');
  const recipes = state.recipes.entries !== null ? state.recipes.entries : await loadEntries('recipes');
  const books = state.books.entries !== null ? state.books.entries : await loadEntries('books');
  return { travel, diary, recipes, books, updatedAt: Date.now() };
}
async function pushToGithub(){
  if(!githubConfigured()) return;
  const snapshot = await buildFullSnapshot();
  const content = JSON.stringify(snapshot, null, 2);
  let attempt = 0;
  while(true){
    attempt++;
    let sha = null;
    const existing = await githubGetFile();
    if(!existing.notFound) sha = existing.sha;
    try{
      await githubPutFile(content, sha, '更新生活手記資料');
      break;
    }catch(e){
      if(e.status === 409 && attempt < 3){ continue; }
      throw e;
    }
  }
  _appSettings.lastSyncedAt = Date.now();
  await setAppSettings(_appSettings);
  _syncState = 'ok';
  updateSyncStatusBadge();
}
let _pushInFlight = false, _pushQueued = false;
async function autoPushToGithub(){
  if(_pushInFlight){ _pushQueued = true; return; }
  _pushInFlight = true;
  try{ await pushToGithub(); }
  catch(e){ _syncState = 'err'; updateSyncStatusBadge(); /* best-effort background sync; surfaced next time the settings panel is opened */ }
  _pushInFlight = false;
  if(_pushQueued){ _pushQueued = false; autoPushToGithub(); }
}
async function pullFromGithub(){
  if(!githubConfigured()) throw new Error('尚未設定 GitHub 同步。');
  const existing = await githubGetFile();
  if(existing.notFound) throw new Error('GitHub 上還沒有資料檔，請先按「立即同步」建立一次。');
  const data = JSON.parse(existing.content);
  await saveEntriesRaw('travel', data.travel || []);
  await saveEntriesRaw('diary', data.diary || []);
  await saveEntriesRaw('recipes', data.recipes || []);
  await saveEntriesRaw('books', data.books || []);
  _appSettings.lastSyncedAt = Date.now();
  await setAppSettings(_appSettings);
  _syncState = 'ok';
  updateSyncStatusBadge();
}
function updateSyncStatusBadge(){
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-status-text');
  const versionEl = document.getElementById('sync-version-badge');
  if(versionEl) versionEl.textContent = APP_VERSION;
  if(!dot || !text) return;
  dot.classList.remove('ok','warn','err');
  if(!githubConfigured()){ dot.classList.add('warn'); text.textContent = '尚未設定同步'; return; }
  if(_syncState === 'err'){ dot.classList.add('err'); text.textContent = '同步失敗'; return; }
  if(_appSettings.lastSyncedAt){
    dot.classList.add('ok');
    text.textContent = '已同步 ' + new Date(_appSettings.lastSyncedAt).toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  } else {
    dot.classList.add('warn');
    text.textContent = '已設定・尚未同步';
  }
}
function showSyncBanner(text, autoHide){
  const el = document.getElementById('sync-banner');
  el.textContent = text;
  el.classList.remove('hidden');
  if(autoHide){ setTimeout(() => { el.classList.add('hidden'); }, 2500); }
}
const appReadyPromise = (async function initApp(){
  _appSettings = await getAppSettings();
  updateSyncStatusBadge();
  if(githubConfigured()){
    showSyncBanner('🔄 正在同步最新資料…');
    try{ await pullFromGithub(); showSyncBanner('✅ 已同步最新資料', true); }
    catch(e){ _syncState = 'err'; updateSyncStatusBadge(); showSyncBanner('⚠️ 同步失敗，先使用本機資料', true); }
  }
})();

const state = {
  travel: { entries: null, ui: { view:'list', tripId:null, subTab:'flights', dayForm:null, itemForm:null, momentForm:null, expenseForm:null, activeChecklist:null, tripMetaEditId:null, expandedDays:new Set() } },
  diary: { entries: null, editingId: null, calYear: new Date().getFullYear(), calMonth: new Date().getMonth(), selectedDate: new Date().toISOString().slice(0,10) },

  books: { entries: null, editingId: null, activeCategory: null },
};

/* ===================== navigation ===================== */
function goTo(view){
  document.querySelectorAll('#view-home, .module-view').forEach(el => el.classList.add('hidden'));
  document.getElementById('view-' + view).classList.remove('hidden');
  window.scrollTo(0,0);
  if(view === 'travel'){ state.travel.ui.view = 'list'; }
  if(view !== 'home' && state[view].entries === null){
    initModule(view);
  } else if(view === 'travel'){
    renderTravelModule();
  }
}

async function initModule(moduleKey){
  await appReadyPromise;
  if(moduleKey === 'travel'){
    document.getElementById('travel-list').innerHTML = '<div class="loading-msg">翻頁中…</div>';
    const entries = await loadEntries('travel');
    entries.forEach(t => {
      if(!t.flights) t.flights = { outbound:{}, ret:{} };
      if(!t.days) t.days = [];
      t.days.forEach(d => { if(!d.items) d.items = []; });
      if(!t.checklists) t.checklists = seedChecklists();
      if(!t.moments) t.moments = [];
      if(!t.expenses) t.expenses = [];
    });
    state.travel.entries = entries;
    renderTravelModule();
    return;
  }
  if(moduleKey === 'diary'){
    document.getElementById('diary-calendar').innerHTML = '<div class="loading-msg">翻頁中…</div>';
    const entries = await loadEntries('diary');
    state.diary.entries = entries;
    renderDiaryModule();
    return;
  }
  const listEl = document.getElementById(moduleKey + '-list');
  listEl.innerHTML = '<div class="loading-msg">翻頁中…</div>';
  const entries = await loadEntries(moduleKey);
  state[moduleKey].entries = entries;
  render[moduleKey]();
}

function seedChecklists(){
  return [
    { id: uid(), name:'行前清單', items: [] },
    { id: uid(), name:'購物清單', items: [] },
    { id: uid(), name:'美食清單', items: [] },
  ];
}

/* ===================== TRAVEL: core ===================== */
function getCurrentTrip(){ return state.travel.entries.find(t => t.id === state.travel.ui.tripId); }
async function persistTravel(){ await saveEntries('travel', state.travel.entries); }

function computeTripDateRange(trip){
  const dates = (trip.days||[]).map(d=>d.date).filter(Boolean).sort();
  if(!dates.length) return '尚未安排日期';
  const first=dates[0], last=dates[dates.length-1];
  return first===last ? fmtDayLabel(first) : `${fmtDayLabel(first)} → ${fmtDayLabel(last)}`;
}
function computeChecklistProgress(trip){
  let total=0, done=0;
  (trip.checklists||[]).forEach(l => { total += l.items.length; done += l.items.filter(i=>i.done).length; });
  return { total, done };
}
function computeExpenseTotalsByCurrency(trip){
  const totals = {};
  (trip.expenses||[]).forEach(x => { totals[x.currency] = (totals[x.currency]||0) + (parseFloat(x.amount)||0); });
  return totals;
}
function statusClass(status){ return status==='已完成' ? 'done' : (status==='即將出發' ? 'soon' : 'planning'); }

function renderTravelModule(){
  const ui = state.travel.ui;
  document.getElementById('travel-list-panel').classList.toggle('hidden', ui.view!=='list');
  document.getElementById('travel-workspace-panel').classList.toggle('hidden', ui.view!=='workspace');
  if(ui.view==='list') renderTripList(); else renderTripWorkspace();
}

/* ---- trip list ---- */
function tripCardHtml(trip){
  const range = computeTripDateRange(trip);
  const prog = computeChecklistProgress(trip);
  const isDone = trip.status === '已完成';
  const totals = computeExpenseTotalsByCurrency(trip);
  const currencyKeys = Object.keys(totals);
  const expenseStat = (isDone && currencyKeys.length)
    ? `💰 ${currencyKeys.map(cur => `${esc(cur)} ${totals[cur].toLocaleString('zh-TW')}`).join('・')}`
    : `💰 ${(trip.expenses||[]).length} 筆花費`;
  return `<div class="trip-card" onclick="openTrip('${trip.id}')">
    <div class="trip-card-top">
      <span class="trip-card-title brush">🧳 ${esc(trip.title)}</span>
      <span class="trip-status-badge status-${statusClass(trip.status)}">${esc(trip.status||'規劃中')}</span>
    </div>
    <div class="trip-card-dest">${esc(trip.destination||'')}</div>
    <div class="trip-card-range">📅 ${esc(range)}</div>
    <div class="trip-card-stats">
      <span>🗓 ${(trip.days||[]).length} 天</span>
      <span>✅ ${prog.done}/${prog.total}</span>
      <span>${expenseStat}</span>
    </div>
  </div>`;
}
function renderTripList(){
  const wrap = document.getElementById('travel-list');
  const list = state.travel.entries || [];
  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">這本手札還是空的，新增第一趟旅程吧！</div>'; return; }
  wrap.innerHTML = list.map(tripCardHtml).join('');
}

function tripMetaFormHtml(trip){

async function saveTripMeta(){

  let trip = editId ? state.travel.entries.find(t=>t.id===editId) : null;
  const isNew = !trip;
  if(isNew){ trip = { id: uid(), createdAt: Date.now(), flights:{outbound:{},ret:{}}, days:[], checklists: seedChecklists(), moments:[], expenses:[] }; }

function deleteItem(dayId, itemId){

    const trip = getCurrentTrip();
    const day = trip.days.find(d=>d.id===dayId);

function itemRowHtml(day, item, index){

  html += `<div class="item-card">
    <span class="item-num">${index+1}</span>

function toggleDayExpand(id){
  const s = state.travel.ui.expandedDays;
  if(s.has(id)) s.delete(id); else s.add(id);
  renderDaysTab(getCurrentTrip());
}
function getLinkedChecklistItems(trip, dayId){
  const out = [];
  (trip.checklists||[]).forEach(l => {
    (l.items||[]).forEach(it => { if(it.dayId===dayId) out.push({ listId:l.id, listName:l.name, item:it }); });
  });
  return out;
}
async function toggleChecklistItemFromDay(listId, itemId){
  const trip = getCurrentTrip();
  const l = trip.checklists.find(x=>x.id===listId);
  const it = l.items.find(x=>x.id===itemId);
  it.done = !it.done;
  renderDaysTab(trip);
  await persistTravel();
}
function dayCardHtml(day){
  const ui = state.travel.ui;
  const trip = getCurrentTrip();
  const expanded = ui.expandedDays.has(day.id);
  const items = [...(day.items||[])].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const linkedChecklistItems = getLinkedChecklistItems(trip, day.id);
  let html = `<div class="day-card">
    <div class="day-card-head" onclick="toggleDayExpand('${day.id}')">
      <div class="day-card-head-top">
        <div class="day-card-head-main">
          <span class="day-date brush">📅 ${esc(fmtDayLabel(day.date))}</span>
          ${day.stay ? `<span class="day-stay">🏨 ${esc(day.stay)}</span>` : ''}
        </div>
        <span class="day-expand-arrow">${expanded?'收起 ▲':'展開 ▼'}</span>
      </div>
      ${day.title ? `<div class="day-title">🎯 ${esc(day.title)}</div>` : ''}
    </div>
    <button class="tiny-link day-edit-link" onclick="openDayForm('${day.id}')">編輯這天</button>`;
  if(expanded){
    html += `<div class="itinerary-track">` + items.map((it,i) => itemRowHtml(day, it, i)).join('') + `</div>`;
    if(ui.itemForm && ui.itemForm.dayId===day.id){
      const editItem = ui.itemForm.editId ? items.find(i=>i.id===ui.itemForm.editId) : null;
      html += itemFormHtml(day, editItem);
    } else {
      html += `<button class="btn btn-ghost btn-sm" style="margin-top:.6rem;" onclick="openItemForm('${day.id}')">+ 新增行程項目</button>`;
    }
    if(linkedChecklistItems.length){
      html += `<div class="day-checklist-block">
        <div class="subtab-h" style="margin:.9rem 0 .4rem;">✅ 這天的清單提醒</div>
        <div class="checklist-items">` + linkedChecklistItems.map(({listId, listName, item}) => `
          <label class="checklist-item ${item.done?'is-done':''}">
            <input type="checkbox" ${item.done?'checked':''} onchange="toggleChecklistItemFromDay('${listId}','${item.id}')">
            ${item.photo ? `<img src="${item.photo}" class="checklist-item-thumb" onclick="event.preventDefault();event.stopPropagation();openImageLightbox(this.src)">` : ''}
            <span>${esc(item.text)}</span>
            <span class="day-link-tag">${esc(listName)}</span>
          </label>`).join('') + `</div>
      </div>`;
    }
  }
  html += `</div>`;
  return html;
}
function renderDaysTab(trip){
  const ui = state.travel.ui;
  const days = [...(trip.days||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let html = `<button class="btn btn-primary btn-sm" onclick="openDayForm()">+ 新增日期</button>`;
  if(ui.dayForm){
    const editingDay = ui.dayForm.editId ? days.find(d=>d.id===ui.dayForm.editId) : null;
    html += dayFormHtml(editingDay);
  }
  if(days.length===0 && !ui.dayForm){ html += `<div class="empty-state">還沒有安排任何一天，先新增第一天吧！</div>`; }
  html += days.map(dayCardHtml).join('');
  document.getElementById('travel-subtab-content').innerHTML = html;
}

    html += `<div class="checklist-panel">

      <div class="checklist-items">`;

async function saveForm(moduleKey){
  const list = state[moduleKey].entries;
  const editingId = state[moduleKey].editingId;
  let entry = editingId ? list.find(x=>x.id===editingId) : { id: uid(), createdAt: Date.now() };
  if(!entry) entry = { id: uid(), createdAt: Date.now() };

  if(moduleKey==='diary'){
    entry.date = val('diary-date') || new Date().toISOString().slice(0,10);
    entry.mood = val('diary-mood').trim();
    entry.weather = val('diary-weather').trim();
    entry.title = val('diary-title').trim() || '無題';
    entry.content = sanitizeHtml(document.getElementById('diary-content').innerHTML);
  } else if(moduleKey==='recipes'){
    entry.name = val('recipe-name').trim() || '未命名料理';
    entry.category = val('recipe-category').trim();
    entry.servings = val('recipe-servings').trim();
    const ratingVal = val('recipe-rating');
    entry.rating = ratingVal === '' ? undefined : Math.max(0, Math.min(5, parseInt(ratingVal,10)));
    entry.made = document.getElementById('recipe-made').checked;
    const recipeFileInput = document.getElementById('recipe-image');
    if(recipeFileInput && recipeFileInput.files[0]){ entry.image = await fileToDataURL(recipeFileInput.files[0]); }
    entry.ingredients = val('recipe-ingredients').split('\n').map(s=>s.trim()).filter(Boolean);
    entry.steps = val('recipe-steps').split('\n').map(s=>s.trim()).filter(Boolean);
    entry.refLink = val('recipe-link').trim();
    entry.notes = val('recipe-notes');
  } else if(moduleKey==='books'){
    entry.title = val('book-title').trim() || '未命名書籍';
    entry.author = val('book-author').trim();
    entry.category = val('book-category').trim();
    entry.status = val('book-status');
    const ratingVal = val('book-rating');
    entry.rating = ratingVal === '' ? undefined : Math.max(0, Math.min(5, parseInt(ratingVal,10)));
    entry.dateFinished = val('book-date');
    entry.notes = sanitizeHtml(document.getElementById('book-notes-rich').innerHTML);
    entry.quotes = sanitizeHtml(document.getElementById('book-quotes-rich').innerHTML);
  }

  if(!editingId) list.push(entry);
  state[moduleKey].entries = list;
  closeForm(moduleKey);
  render[moduleKey]();
  await saveEntries(moduleKey, list);
}
function deleteEntry(moduleKey){
  const editingId = state[moduleKey].editingId;
  if(!editingId) return;
  showConfirmModal('確定要刪除這一筆嗎？刪除後就找不回來了。', async () => {
    state[moduleKey].entries = state[moduleKey].entries.filter(x=>x.id!==editingId);
    closeForm(moduleKey);
    render[moduleKey]();
    await saveEntries(moduleKey, state[moduleKey].entries);
  });
}

function jumpToToday(){
  const t = new Date();
  state.diary.calYear = t.getFullYear();
  state.diary.calMonth = t.getMonth();
  state.diary.selectedDate = t.toISOString().slice(0,10);
  renderDiaryModule();
}
function shiftDiaryMonth(delta){
  let m = state.diary.calMonth + delta, y = state.diary.calYear;
  if(m < 0){ m = 11; y--; } else if(m > 11){ m = 0; y++; }
  state.diary.calMonth = m; state.diary.calYear = y;
  renderDiaryCalendarGrid();
}
function selectDiaryDate(dateStr){

  if(dayEntries.length===0){
    html += `<div class="empty-state">這天還沒寫日記。</div>`;
  } else {
    html += dayEntries.map(e => `
      <div class="diary-entry">
        <div class="diary-view-symbols">${esc(e.mood||'')} ${esc(e.weather||'')}</div>
        <div class="diary-view-title brush">${esc(e.title)}</div>
        <div class="diary-view-content">${diaryContentToHtml(e.content)}</div>
        <button class="tiny-link" onclick='openForm("diary", ${attrJson(e)})'>編輯</button>
      </div>`).join('');
  }
  return html;
}
function renderDiaryEntryPanel(){
  const panel = document.getElementById('diary-entry-panel');
  if(!state.diary.selectedDate){ panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  document.getElementById('diary-entry-content').innerHTML = diaryDetailPanelHtml(diaryEntriesByDate());
}
function diaryDayBadge(dayEntries){
  const syms = [];
  dayEntries.forEach(e => { syms.push(e.mood, e.weather); });
  const filled = syms.filter(Boolean);
  return filled.length ? filled.slice(0,3).join('') : (dayEntries.length ? '📝' : '');
}
function renderDiaryCalendarGrid(){
  const byDate = diaryEntriesByDate();
  const y = state.diary.calYear, m = state.diary.calMonth;
  const startWeekday = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div class="cal-cell cal-cell-empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEntries = byDate[dateStr] || [];
    const badge = diaryDayBadge(dayEntries);
    const cls = ['cal-cell'];
    if(dateStr===todayStr) cls.push('is-today');
    if(dateStr===state.diary.selectedDate) cls.push('is-selected');
    if(dayEntries.length) cls.push('has-entry');
    cells += `<button class="${cls.join(' ')}" onclick="selectDiaryDate('${dateStr}')">
      <span class="cal-daynum">${d}</span>
      ${badge ? `<span class="cal-day-badge">${esc(badge)}</span>` : ''}
    </button>`;
  }
  document.getElementById('diary-calendar').innerHTML = `
    <div class="cal-header">
      <button class="icon-btn" onclick="shiftDiaryMonth(-1)">◀</button>
      <span class="cal-title brush">${y}年${m+1}月</span>
      <button class="icon-btn" onclick="shiftDiaryMonth(1)">▶</button>
    </div>
    <div class="cal-weekdays">${['日','一','二','三','四','五','六'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}
function renderDiaryModule(){
  renderDiaryCalendarGrid();
  renderDiaryEntryPanel();
}

const render = {
  diary(){ renderDiaryModule(); },
  recipes(){
    const all = state.recipes.entries;
    const cats = recipeCategories();
    const st = state.recipes;
    const list = all
      .filter(e => !st.activeCategory || e.category===st.activeCategory)
      .filter(e => st.madeFilter==='made' ? !!e.made : (st.madeFilter==='notmade' ? !e.made : true))
      .filter(e => !st.minRating || (e.rating||0) >= st.minRating)
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const el = document.getElementById('recipes-list');
    let html = '';
    if(cats.length){
      html += `<div class="checklist-pills" style="margin-bottom:.5rem;">` +
        `<button class="pill ${!st.activeCategory?'pill-active':''}" onclick="setRecipeCategoryFilter(null)">全部分類</button>` +
        cats.map(c => `<button class="pill ${st.activeCategory===c?'pill-active':''}" onclick="setRecipeCategoryFilter('${esc(c)}')">${esc(c)}</button>`).join('') +
        `</div>`;
    }
    html += `<div class="checklist-pills" style="margin-bottom:1rem;">
      <button class="pill ${st.madeFilter==='all'?'pill-active':''}" onclick="setRecipeMadeFilter('all')">全部</button>
      <button class="pill ${st.madeFilter==='made'?'pill-active':''}" onclick="setRecipeMadeFilter('made')">✅ 做過</button>
      <button class="pill ${st.madeFilter==='notmade'?'pill-active':''}" onclick="setRecipeMadeFilter('notmade')">還沒做</button>
      <select class="day-link-select" style="max-width:130px;" onchange="setRecipeMinRating(this.value)">
        <option value="0" ${!st.minRating?'selected':''}>評分不限</option>
        <option value="5" ${st.minRating===5?'selected':''}>5★</option>
        <option value="4" ${st.minRating===4?'selected':''}>4★以上</option>
        <option value="3" ${st.minRating===3?'selected':''}>3★以上</option>
      </select>
    </div>`;
    if(list.length===0){
      html += `<div class="empty-state">${all.length===0 ? '食譜盒是空的，把第一道拿手菜記下來吧。' : '這個條件下還沒有食譜。'}</div>`;
      el.innerHTML = html;
      return;
    }
    html += list.map(e => `
      <div class="recipe-card">
        <div class="recipe-top"><span class="recipe-name brush">${esc(e.name)}</span><span class="recipe-meta">${esc(e.category||'')}${e.servings?`・${esc(e.servings)}`:''}</span></div>
        <div class="recipe-badges">
          ${e.made?'<span class="item-badge" style="background:var(--status-done-bg);color:var(--status-done-fg);">✅ 做過</span>':''}
          ${e.rating!==undefined?`<span class="recipe-stars">${stars(e.rating)}</span>`:''}
        </div>
        ${e.image?`<img src="${e.image}" class="item-thumb-sq" style="margin:.5rem 0;" onclick="openImageLightbox(this.src)">`:''}
        ${(e.ingredients&&e.ingredients.length)?`<div class="recipe-section-label">食材</div><ul class="recipe-list">${e.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
        ${(e.steps&&e.steps.length)?`<div class="recipe-section-label">做法</div><ol class="recipe-list">${e.steps.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`:''}
        ${e.notes?`<div class="recipe-notes">${esc(e.notes)}</div>`:''}
        ${e.refLink?`<div class="recipe-notes"><a href="${esc(e.refLink)}" target="_blank" rel="noopener">🔗 參考連結</a></div>`:''}
        <button class="tiny-link" onclick='openForm("recipes", ${attrJson(e)})'>編輯</button>
      </div>`).join('');
    el.innerHTML = html;
  },
  books(){
    const order = {'在讀':0,'想讀':1,'讀完':2};
    const all = state.books.entries;
    const cats = bookCategories();
    const active = state.books.activeCategory;
    const list = all
      .filter(e => !active || e.category===active)
      .sort((a,b)=>(order[a.status]??3)-(order[b.status]??3) || (b.createdAt||0)-(a.createdAt||0));
    const el = document.getElementById('books-list');
    let html = '';
    if(cats.length){
      html += `<div class="checklist-pills" style="margin-bottom:1rem;">` +
        `<button class="pill ${!active?'pill-active':''}" onclick="setBookCategoryFilter(null)">全部</button>` +
        cats.map(c => `<button class="pill ${active===c?'pill-active':''}" onclick="setBookCategoryFilter('${esc(c)}')">${esc(c)}</button>`).join('') +
        `</div>`;
    }
    if(list.length===0){
      html += `<div class="empty-state">${active ? '這個分類還沒有書。' : '書架還空著，寫下正在讀或想讀的第一本書。'}</div>`;
      el.innerHTML = html;
      return;
    }
    html += list.map(e => `
      <div class="book-card">
        <div class="book-spine"></div>
        <div class="book-main">
          <div class="book-top">
            <div><span class="book-title brush">${esc(e.title)}</span>${e.author?`<div class="book-author">${esc(e.author)}</div>`:''}</div>
            <span class="book-status">${esc(e.status||'想讀')}</span>
          </div>
          ${e.category?`<span class="book-category-tag">${esc(e.category)}</span>`:''}
          ${e.rating!==undefined?`<div class="book-stars">${stars(e.rating)}</div>`:''}
          ${e.dateFinished?`<div class="book-author">完成於 ${esc(fmtDate(e.dateFinished))}</div>`:''}
          ${e.notes?`<div class="book-section-label">心得內容</div><div class="book-notes">${diaryContentToHtml(e.notes)}</div>`:''}
          ${e.quotes?`<div class="book-section-label">喜歡的句子</div><div class="book-notes">${diaryContentToHtml(e.quotes)}</div>`:''}
          <button class="tiny-link" onclick='openForm("books", ${attrJson(e)})'>編輯</button>
        </div>
      </div>`).join('');
    el.innerHTML = html;
  }
};
function recipeCategories(){
  const set = new Set();
  (state.recipes.entries||[]).forEach(e => { if(e.category) set.add(e.category); });
  return [...set].sort();
}
function setRecipeCategoryFilter(cat){ state.recipes.activeCategory = cat; render.recipes(); }
function setRecipeMadeFilter(f){ state.recipes.madeFilter = f; render.recipes(); }
function setRecipeMinRating(v){ state.recipes.minRating = parseInt(v,10) || 0; render.recipes(); }
function bookCategories(){
  const set = new Set();
  (state.books.entries||[]).forEach(e => { if(e.category) set.add(e.category); });
  return [...set].sort();
}
function setBookCategoryFilter(cat){
  state.books.activeCategory = cat;
  render.books();
}
</script>
</body>
</html>
