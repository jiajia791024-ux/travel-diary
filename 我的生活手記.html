<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的生活手記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg-app:#FFF8EF;
  --ink:#4A3F35;
  --ink-soft:#94897A;
  --white:#FFFFFF;
  --shadow:rgba(74,63,53,.16);

  --travel-accent:#FF9B6A; --travel-accent-dark:#E2703A; --travel-bg:#FFE9D9; --travel-bg-2:#FFF4EB;
  --diary-accent:#6FA8DC;  --diary-accent-dark:#4A85BB;  --diary-bg:#E8F2FC;  --diary-bg-2:#F3F9FE;
  --recipe-accent:#8FC17E; --recipe-accent-dark:#5F9C4E; --recipe-bg:#EAF7E4; --recipe-bg-2:#F4FBF0;
  --book-accent:#C98BC9;   --book-accent-dark:#A15FA1;   --book-bg:#F6EAF8;   --book-bg-2:#FBF2FC;

  --status-planning-bg:#FFE3C2; --status-planning-fg:#B5651D;
  --status-soon-bg:#FFD6D6;     --status-soon-fg:#C0392B;
  --status-done-bg:#D9F2D2;     --status-done-fg:#3C7A3C;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans TC', sans-serif;
  color:var(--ink);
  background:var(--bg-app);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:'Noto Sans TC', sans-serif;}
h1,h2,h3{margin:0;font-weight:400;}
.hidden{display:none !important;}
:focus-visible{outline:3px solid #E2703A; outline-offset:2px;}
a{color:inherit;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

.brush{ font-family:'ZCOOL KuaiLe', cursive; font-weight:400; }

/* ============ HOME ============ */
#view-home{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  padding-bottom:3rem;
  background:var(--bg-app);
}
#view-home::before, #view-home::after{
  content:""; position:absolute; border-radius:50%; filter:blur(2px); z-index:0;
}
#view-home::before{ width:340px; height:340px; background:var(--travel-bg); top:-120px; left:-100px; opacity:.7; }
#view-home::after{ width:260px; height:260px; background:var(--book-bg); bottom:-80px; right:-60px; opacity:.7; }
.home-header{ position:relative; z-index:1; text-align:center; padding:4rem 1.5rem .5rem; }
.home-header h1{ font-size:clamp(2.2rem, 7vw, 3.1rem); color:var(--ink); }
.home-header p{ font-size:1.05rem; color:var(--ink-soft); margin-top:.6rem; }

.desk-items{
  position:relative; z-index:1;
  display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch;
  gap:1.6rem; padding:2.5rem 1.5rem 4rem; max-width:900px; margin:0 auto;
}
.desk-item{
  width:190px; border:3px solid transparent; border-radius:26px;
  background:var(--white);
  padding:1.6rem 1.1rem 1.3rem;
  display:flex; flex-direction:column; align-items:center; gap:.55rem;
  box-shadow:0 8px 0 var(--shadow), 0 10px 18px var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease;
}
.desk-item:hover, .desk-item:focus-visible{ transform:translateY(-6px) scale(1.03); }
.desk-item .badge{
  width:70px; height:70px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:2.1rem;
}
.desk-item .d-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.35rem; }
.desk-item .d-tag{ font-size:.85rem; color:var(--ink-soft); text-align:center; }
.desk-item.i-travel{ border-color:var(--travel-accent); }
.desk-item.i-travel .badge{ background:var(--travel-bg); }
.desk-item.i-diary{ border-color:var(--diary-accent); }
.desk-item.i-diary .badge{ background:var(--diary-bg); }
.desk-item.i-recipes{ border-color:var(--recipe-accent); }
.desk-item.i-recipes .badge{ background:var(--recipe-bg); }
.desk-item.i-books{ border-color:var(--book-accent); }
.desk-item.i-books .badge{ background:var(--book-bg); }

/* ============ shared module chrome ============ */
.module-view{ min-height:100vh; padding-bottom:4rem; }
.module-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap; padding:2rem 1.5rem 1rem; max-width:820px; margin:0 auto; }
.back-link{ border:none; background:none; font-size:.92rem; padding:0; color:var(--ink-soft); cursor:pointer; }
.back-link:hover{ text-decoration:underline; }
.module-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:2rem; margin-top:.3rem; }
.module-sub{ font-size:.95rem; color:var(--ink-soft); margin-top:.15rem; }
.module-body{ max-width:820px; margin:0 auto; padding:0 1.5rem; }

.btn{ border:none; border-radius:999px; padding:.62rem 1.25rem; font-size:.92rem; font-weight:700; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.15); }
.btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
.btn-sm{ padding:.4rem .9rem; font-size:.85rem; }
.btn-ghost{ background:var(--white); color:var(--ink-soft); border:2px solid #e6ddce; box-shadow:none; }
.btn-danger{ background:#E2703A; }
.icon-btn{ border:none; background:var(--white); border-radius:50%; width:2.1rem; height:2.1rem; box-shadow:0 2px 6px var(--shadow); font-size:1rem; }
.tiny-link{ border:none; background:none; font-size:.82rem; color:var(--ink-soft); text-decoration:underline; padding:.2rem 0; }
.tiny-link-danger{ color:#C0392B; }
.tiny-x{ border:none; background:none; color:#C0392B; font-size:.85rem; padding:0 .3rem; }

.field{ margin-bottom:.9rem; }
.field label{ display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:.25rem; font-weight:500; }
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=datetime-local], .field input[type=number], .field textarea, .field select{
  width:100%; border:2px solid #ecdfc9; border-radius:12px; background:var(--white); padding:.55rem .7rem; font-size:.95rem; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:4rem; line-height:1.6; }
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--travel-accent); }
.checkbox-field label{ display:flex; align-items:center; gap:.4rem; font-size:.9rem; color:var(--ink); }
.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:.9rem; }
@media (max-width:480px){ .row-2{grid-template-columns:1fr;} }

.form-panel{ background:var(--white); border-radius:18px; padding:1.2rem 1.2rem 1rem; margin-bottom:1.2rem; box-shadow:0 4px 14px var(--shadow); }
.form-actions{ display:flex; gap:.6rem; margin-top:.4rem; flex-wrap:wrap; }
.img-preview{ display:block; margin-top:.5rem; max-height:100px; border-radius:10px; }

.empty-state{ font-size:1.05rem; color:var(--ink-soft); text-align:center; padding:2.6rem 1rem; }
.loading-msg{ text-align:center; padding:2.2rem 1rem; color:var(--ink-soft); }

/* module backgrounds/colors */
#view-travel{ background:var(--travel-bg-2); } #view-travel .module-title, #view-travel .back-link{ color:var(--travel-accent-dark); } #view-travel .btn-primary{ background:var(--travel-accent); }
#view-diary{  background:var(--diary-bg-2); }  #view-diary  .module-title, #view-diary  .back-link{ color:var(--diary-accent-dark); }  #view-diary  .btn-primary{ background:var(--diary-accent); }
#view-recipes{background:var(--recipe-bg-2);}  #view-recipes.module-title{}
#view-recipes .module-title, #view-recipes .back-link{ color:var(--recipe-accent-dark); } #view-recipes .btn-primary{ background:var(--recipe-accent); }
#view-books{  background:var(--book-bg-2); }   #view-books  .module-title, #view-books  .back-link{ color:var(--book-accent-dark); }  #view-books  .btn-primary{ background:var(--book-accent); }

/* ---------- Travel: trip list ---------- */
.trip-card{ background:var(--white); border-radius:20px; padding:1.1rem 1.2rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); cursor:pointer; transition:transform .15s ease; }
.trip-card:hover{ transform:translateY(-3px); }
.trip-card-top{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; }
.trip-card-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.3rem; }
.trip-status-badge{ font-size:.75rem; font-weight:700; padding:.2rem .65rem; border-radius:999px; }
.status-planning{ background:var(--status-planning-bg); color:var(--status-planning-fg); }
.status-soon{ background:var(--status-soon-bg); color:var(--status-soon-fg); }
.status-done{ background:var(--status-done-bg); color:var(--status-done-fg); }
.trip-card-dest{ color:var(--ink-soft); margin-top:.2rem; font-size:.92rem; }
.trip-card-range{ font-size:.85rem; color:var(--ink-soft); margin-top:.3rem; }
.trip-card-stats{ display:flex; gap:1rem; margin-top:.55rem; font-size:.85rem; color:var(--travel-accent-dark); font-weight:600; flex-wrap:wrap; }

/* ---------- Travel: workspace ---------- */
.ws-title-row{ display:flex; align-items:center; gap:.6rem; margin-top:.3rem; flex-wrap:wrap; }
.ws-meta-row{ display:flex; gap:.9rem; align-items:center; margin-top:.4rem; font-size:.88rem; color:var(--ink-soft); flex-wrap:wrap; }
.subtabs{ display:flex; gap:.5rem; flex-wrap:wrap; padding:0 1.5rem 1rem; max-width:820px; margin:0 auto; }
.subtab-pill{ border:2px solid var(--travel-accent); background:var(--white); color:var(--travel-accent-dark); border-radius:999px; padding:.45rem 1rem; font-size:.88rem; font-weight:600; }
.subtab-pill-active{ background:var(--travel-accent); color:#fff; }
.subtab-h{ font-weight:700; font-size:.95rem; color:var(--travel-accent-dark); margin:0 0 .5rem; }
.flight-block{ background:var(--white); border-radius:18px; padding:1.1rem 1.2rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); }

.day-card{ background:var(--white); border-radius:18px; padding:1rem 1.1rem 1.1rem; margin-bottom:1.1rem; box-shadow:0 4px 12px var(--shadow); }
.day-card-head{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:.6rem; }
.day-date{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.15rem; color:var(--travel-accent-dark); }
.day-stay{ font-size:.85rem; color:var(--ink-soft); }
.item-row{ border-top:1px dashed #eee0cc; padding:.6rem 0; }
.item-row:first-of-type{ border-top:none; }
.item-row-main{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
.item-time{ font-weight:700; color:var(--travel-accent-dark); font-size:.88rem; }
.item-place{ font-weight:600; }
.item-badge{ font-size:.72rem; background:var(--status-soon-bg); color:var(--status-soon-fg); border-radius:999px; padding:.1rem .5rem; }
.item-row-sub{ display:flex; gap:.9rem; font-size:.82rem; color:var(--ink-soft); margin-top:.25rem; flex-wrap:wrap; }
.item-row-sub a{ text-decoration:underline; }
.item-note{ font-size:.85rem; color:var(--ink-soft); margin-top:.3rem; white-space:pre-wrap; }
.item-thumb{ display:block; margin-top:.4rem; max-height:110px; border-radius:10px; }

.checklist-pills{ display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
.pill{ border:2px solid var(--travel-accent); background:var(--white); color:var(--travel-accent-dark); border-radius:999px; padding:.4rem .9rem; font-size:.85rem; font-weight:600; }
.pill-active{ background:var(--travel-accent); color:#fff; }
.pill-add{ border-style:dashed; }
.checklist-panel{ background:var(--white); border-radius:18px; padding:1.1rem 1.2rem; box-shadow:0 4px 12px var(--shadow); }
.checklist-panel-head{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; margin-bottom:.5rem; }
.checklist-name{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.15rem; }
.checklist-progress{ font-size:.82rem; color:var(--ink-soft); }
.checklist-items{ display:flex; flex-direction:column; gap:.3rem; }
.checklist-item{ display:flex; align-items:center; gap:.55rem; font-size:.93rem; padding:.3rem 0; }
.checklist-item input{ width:18px; height:18px; accent-color:var(--travel-accent); }
.checklist-item.is-done span{ text-decoration:line-through; color:var(--ink-soft); }
.checklist-item span{ flex:1; }
.checklist-add-row{ display:flex; gap:.5rem; margin-top:.7rem; }
.checklist-add-row input{ flex:1; border:2px solid #ecdfc9; border-radius:12px; padding:.5rem .7rem; }

.moment-card{ background:var(--white); border-radius:18px; padding:1rem 1.1rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); }
.moment-photo{ display:block; max-height:220px; border-radius:14px; margin-bottom:.6rem; }
.moment-text{ font-size:.95rem; line-height:1.7; white-space:pre-wrap; }

.expense-total{ text-align:center; background:var(--white); border-radius:18px; padding:1.3rem 1rem; margin-bottom:1.1rem; box-shadow:0 4px 12px var(--shadow); font-size:.95rem; color:var(--ink-soft); }
.expense-total-num{ font-family:'ZCOOL KuaiLe',cursive; font-size:2rem; color:var(--travel-accent-dark); }
.expense-daylist, .expense-itemlist{ background:var(--white); border-radius:18px; padding:.5rem 1.1rem; box-shadow:0 4px 12px var(--shadow); }
.expense-day-row, .expense-item-row{ display:flex; justify-content:space-between; padding:.55rem 0; font-size:.9rem; border-top:1px dashed #eee0cc; }
.expense-day-row:first-child, .expense-item-row:first-child{ border-top:none; }

.modal-overlay{ position:fixed; inset:0; background:rgba(50,40,30,.42); display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem; }
.modal-box{ background:var(--white); border-radius:22px; padding:1.4rem; max-width:420px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 12px 30px rgba(0,0,0,.25); }

/* ---------- Diary ---------- */
.diary-entry{ background:var(--white); border-radius:18px; padding:1rem 1.15rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); }
.diary-top{ display:flex; justify-content:space-between; gap:.6rem; align-items:center; flex-wrap:wrap;}
.diary-date{ font-size:.82rem; color:var(--diary-accent-dark); font-weight:600; }
.diary-mood{ font-size:1.2rem; }
.diary-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.25rem; margin-top:.2rem; }
.diary-content{ margin-top:.4rem; font-size:.93rem; line-height:1.75; white-space:pre-wrap; }

/* ---------- Recipes ---------- */
.recipe-card{ background:var(--white); border-radius:18px; padding:1.1rem 1.2rem; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); }
.recipe-top{ display:flex; justify-content:space-between; gap:.6rem; align-items:baseline; flex-wrap:wrap;}
.recipe-name{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.3rem; }
.recipe-meta{ font-size:.8rem; color:var(--recipe-accent-dark); font-weight:600; }
.recipe-stars{ color:#E0A32E; font-size:.9rem; }
.recipe-section-label{ font-size:.78rem; color:var(--recipe-accent-dark); font-weight:700; margin-top:.6rem; }
.recipe-list{ margin:.3rem 0 0; padding-left:1.1rem; font-size:.9rem; line-height:1.7; }
.recipe-notes{ margin-top:.5rem; font-size:.88rem; color:var(--ink-soft); white-space:pre-wrap;}

/* ---------- Books ---------- */
.book-card{ display:flex; background:var(--white); border-radius:18px; overflow:hidden; margin-bottom:1rem; box-shadow:0 4px 12px var(--shadow); }
.book-spine{ width:9px; background:var(--book-accent); flex-shrink:0; }
.book-main{ padding:1rem 1.15rem; flex:1; }
.book-top{ display:flex; justify-content:space-between; gap:.6rem; align-items:baseline; flex-wrap:wrap;}
.book-title{ font-family:'ZCOOL KuaiLe',cursive; font-size:1.25rem; }
.book-author{ font-size:.8rem; color:var(--ink-soft); }
.book-status{ font-size:.72rem; font-weight:700; padding:.15rem .55rem; border-radius:999px; background:var(--book-bg); color:var(--book-accent-dark); }
.book-stars{ color:#E0A32E; font-size:.88rem; margin-top:.2rem;}
.book-notes{ margin-top:.4rem; font-size:.9rem; line-height:1.7; white-space:pre-wrap;}

@media (max-width:480px){ .desk-item{ width:44%; min-width:150px; } }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section id="view-home">
  <div class="home-header">
    <h1 class="brush">我的生活手記</h1>
    <p>旅行、日常、料理與閱讀，都留在這裡</p>
  </div>
  <div class="desk-items">
    <button class="desk-item i-travel" onclick="goTo('travel')"><span class="badge">🧳</span><span class="d-title brush">旅行手札</span><span class="d-tag">下一趟去哪呢？</span></button>
    <button class="desk-item i-diary" onclick="goTo('diary')"><span class="badge">📔</span><span class="d-title brush">生活日記</span><span class="d-tag">今天過得如何？</span></button>
    <button class="desk-item i-recipes" onclick="goTo('recipes')"><span class="badge">🍲</span><span class="d-title brush">食譜卡</span><span class="d-tag">來記一道好菜</span></button>
    <button class="desk-item i-books" onclick="goTo('books')"><span class="badge">📚</span><span class="d-title brush">讀書心得</span><span class="d-tag">最近在讀什麼？</span></button>
  </div>
</section>

<!-- ================= TRAVEL ================= -->
<section id="view-travel" class="module-view hidden">
  <div class="module-header">
    <div>
      <button class="back-link" onclick="goTo('home')">← 回到桌面</button>
      <h2 class="module-title brush">旅行手札</h2>
      <p class="module-sub">規劃中的與走過的旅程</p>
    </div>
    <button class="btn btn-primary" onclick="openTripMetaForm(null)">+ 新增行程</button>
  </div>

  <div id="travel-list-panel" class="module-body">
    <div id="travel-list"></div>
  </div>

  <div id="travel-workspace-panel" class="hidden">
    <div class="module-body" id="travel-workspace-header"></div>
    <div id="travel-subtabs" class="subtabs"></div>
    <div class="module-body" id="travel-subtab-content"></div>
  </div>
</section>

<!-- trip meta modal -->
<div id="trip-meta-overlay" class="modal-overlay hidden">
  <div class="modal-box" id="trip-meta-modal-content"></div>
</div>

<!-- ================= DIARY ================= -->
<section id="view-diary" class="module-view hidden">
  <div class="module-header">
    <div>
      <button class="back-link" onclick="goTo('home')">← 回到桌面</button>
      <h2 class="module-title brush">生活日記</h2>
      <p class="module-sub">寫給自己的日常紀錄</p>
    </div>
    <button class="btn btn-primary" onclick="openForm('diary')">+ 新增一篇</button>
  </div>
  <div class="module-body">
    <div id="diary-form-slot"></div>
    <div id="diary-list"></div>
  </div>
</section>

<!-- ================= RECIPES ================= -->
<section id="view-recipes" class="module-view hidden">
  <div class="module-header">
    <div>
      <button class="back-link" onclick="goTo('home')">← 回到桌面</button>
      <h2 class="module-title brush">食譜卡</h2>
      <p class="module-sub">做過、想再做一次的菜</p>
    </div>
    <button class="btn btn-primary" onclick="openForm('recipes')">+ 新增食譜</button>
  </div>
  <div class="module-body">
    <div id="recipes-form-slot"></div>
    <div id="recipes-list"></div>
  </div>
</section>

<!-- ================= BOOKS ================= -->
<section id="view-books" class="module-view hidden">
  <div class="module-header">
    <div>
      <button class="back-link" onclick="goTo('home')">← 回到桌面</button>
      <h2 class="module-title brush">讀書心得</h2>
      <p class="module-sub">讀過的、正在讀的、想讀的書</p>
    </div>
    <button class="btn btn-primary" onclick="openForm('books')">+ 新增一本</button>
  </div>
  <div class="module-body">
    <div id="books-form-slot"></div>
    <div id="books-list"></div>
  </div>
</section>

<script>
/* ===================== helpers ===================== */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2)); }
function esc(str){ if(str===undefined||str===null) return ''; return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function attrJson(obj){ return JSON.stringify(obj).replace(/&/g,'&amp;').replace(/'/g,'&#39;'); }
function val(id){ const el=document.getElementById(id); return el ? el.value : ''; }
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); if(p.length!==3) return d; return `${p[0]}/${parseInt(p[1],10)}/${parseInt(p[2],10)}`; }
function fmtDayLabel(d){ if(!d) return '尚未設定日期'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; const week=['日','一','二','三','四','五','六'][dt.getDay()]; return `${dt.getMonth()+1}/${dt.getDate()}（${week}）`; }
function stars(n){ n=parseInt(n,10)||0; return '★★★★★☆☆☆☆☆'.slice(5-n,10-n); }
function formatMoney(n){ if(n===undefined||n===null||isNaN(n)) return 'NT$ 0'; return 'NT$ ' + Math.round(n).toLocaleString('zh-TW'); }

function fileToDataURL(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    if(!file){ resolve(''); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===================== storage ===================== */
const STORAGE_KEYS = { travel:'travel:entries', diary:'diary:entries', recipes:'recipes:entries', books:'books:entries' };
async function loadEntries(moduleKey){
  try{
    const res = await window.storage.get(STORAGE_KEYS[moduleKey], false);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveEntries(moduleKey, arr){
  try{ return !!(await window.storage.set(STORAGE_KEYS[moduleKey], JSON.stringify(arr), false)); }
  catch(e){ console.error('storage set failed', e); return false; }
}

/* ===================== state ===================== */
const state = {
  travel: { entries: null, ui: { view:'list', tripId:null, subTab:'flights', dayForm:null, itemForm:null, momentForm:null, activeChecklist:null, tripMetaEditId:null } },
  diary: { entries: null, editingId: null },
  recipes: { entries: null, editingId: null },
  books: { entries: null, editingId: null },
};

/* ===================== navigation ===================== */
function goTo(view){
  document.querySelectorAll('#view-home, .module-view').forEach(el => el.classList.add('hidden'));
  document.getElementById('view-' + view).classList.remove('hidden');
  window.scrollTo(0,0);
  if(view === 'travel'){ state.travel.ui.view = 'list'; }
  if(view !== 'home' && state[view].entries === null){
    initModule(view);
  } else if(view === 'travel'){
    renderTravelModule();
  }
}

async function initModule(moduleKey){
  if(moduleKey === 'travel'){
    document.getElementById('travel-list').innerHTML = '<div class="loading-msg">翻頁中…</div>';
    const entries = await loadEntries('travel');
    entries.forEach(t => {
      if(!t.flights) t.flights = { outbound:{}, ret:{} };
      if(!t.days) t.days = [];
      if(!t.checklists) t.checklists = seedChecklists();
      if(!t.moments) t.moments = [];
    });
    state.travel.entries = entries;
    renderTravelModule();
    return;
  }
  const listEl = document.getElementById(moduleKey + '-list');
  listEl.innerHTML = '<div class="loading-msg">翻頁中…</div>';
  const entries = await loadEntries(moduleKey);
  state[moduleKey].entries = entries;
  render[moduleKey]();
}

function seedChecklists(){
  return [
    { id: uid(), name:'行前清單', items: [] },
    { id: uid(), name:'購物清單', items: [] },
    { id: uid(), name:'美食清單', items: [] },
  ];
}

/* ===================== TRAVEL: core ===================== */
function getCurrentTrip(){ return state.travel.entries.find(t => t.id === state.travel.ui.tripId); }
async function persistTravel(){ await saveEntries('travel', state.travel.entries); }

function computeTripTotal(trip){
  let total = 0;
  (trip.days||[]).forEach(day => (day.items||[]).forEach(it => { const c=parseFloat(it.cost); if(!isNaN(c)) total += c; }));
  return total;
}
function computeTripDateRange(trip){
  const dates = (trip.days||[]).map(d=>d.date).filter(Boolean).sort();
  if(!dates.length) return '尚未安排日期';
  const first=dates[0], last=dates[dates.length-1];
  return first===last ? fmtDayLabel(first) : `${fmtDayLabel(first)} → ${fmtDayLabel(last)}`;
}
function computeChecklistProgress(trip){
  let total=0, done=0;
  (trip.checklists||[]).forEach(l => { total += l.items.length; done += l.items.filter(i=>i.done).length; });
  return { total, done };
}
function statusClass(status){ return status==='已完成' ? 'done' : (status==='即將出發' ? 'soon' : 'planning'); }

function renderTravelModule(){
  const ui = state.travel.ui;
  document.getElementById('travel-list-panel').classList.toggle('hidden', ui.view!=='list');
  document.getElementById('travel-workspace-panel').classList.toggle('hidden', ui.view!=='workspace');
  if(ui.view==='list') renderTripList(); else renderTripWorkspace();
}

/* ---- trip list ---- */
function tripCardHtml(trip){
  const range = computeTripDateRange(trip);
  const total = computeTripTotal(trip);
  const prog = computeChecklistProgress(trip);
  return `<div class="trip-card" onclick="openTrip('${trip.id}')">
    <div class="trip-card-top">
      <span class="trip-card-title brush">🧳 ${esc(trip.title)}</span>
      <span class="trip-status-badge status-${statusClass(trip.status)}">${esc(trip.status||'規劃中')}</span>
    </div>
    <div class="trip-card-dest">${esc(trip.destination||'')}</div>
    <div class="trip-card-range">📅 ${esc(range)}</div>
    <div class="trip-card-stats">
      <span>🗓 ${(trip.days||[]).length} 天</span>
      <span>✅ ${prog.done}/${prog.total}</span>
      <span>💰 ${formatMoney(total)}</span>
    </div>
  </div>`;
}
function renderTripList(){
  const wrap = document.getElementById('travel-list');
  const list = state.travel.entries || [];
  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">這本手札還是空的，新增第一趟旅程吧！</div>'; return; }
  wrap.innerHTML = list.map(tripCardHtml).join('');
}

function openTripMetaForm(trip){
  state.travel.ui.tripMetaEditId = trip ? trip.id : null;
  document.getElementById('trip-meta-modal-content').innerHTML = tripMetaFormHtml(trip);
  document.getElementById('trip-meta-overlay').classList.remove('hidden');
}
function closeTripMetaForm(){ document.getElementById('trip-meta-overlay').classList.add('hidden'); }
async function saveTripMeta(){
  const editId = state.travel.ui.tripMetaEditId;
  let trip = editId ? state.travel.entries.find(t=>t.id===editId) : null;
  const isNew = !trip;
  if(isNew){ trip = { id: uid(), createdAt: Date.now(), flights:{outbound:{},ret:{}}, days:[], checklists: seedChecklists(), moments:[] }; }
  trip.title = val('tm-title').trim() || '未命名行程';
  trip.destination = val('tm-dest').trim();
  trip.status = val('tm-status');
  if(isNew) state.travel.entries.push(trip);
  closeTripMetaForm();
  await persistTravel();
  if(isNew){ openTrip(trip.id); } else { if(state.travel.ui.view==='workspace') renderTripWorkspace(); else renderTravelModule(); }
}
async function deleteTrip(id){
  if(!confirm('確定要刪除整趟行程嗎？所有航班、每日行程、清單、趣事都會一起刪除，無法復原。')) return;
  state.travel.entries = state.travel.entries.filter(t=>t.id!==id);
  closeTripMetaForm();
  state.travel.ui.view = 'list';
  renderTravelModule();
  await persistTravel();
}

/* ---- workspace shell ---- */
function openTrip(id){
  const ui = state.travel.ui;
  ui.view='workspace'; ui.tripId=id; ui.subTab = ui.subTab || 'flights';
  ui.dayForm=null; ui.itemForm=null; ui.momentForm=null; ui.activeChecklist=null;
  renderTravelModule();
  window.scrollTo(0,0);
}
function backToTripList(){ state.travel.ui.view='list'; renderTravelModule(); window.scrollTo(0,0); }

function renderTripWorkspace(){
  const trip = getCurrentTrip();

  renderWorkspaceHeader(trip);
  renderSubtabsBar();
  renderSubtabContent();
}

  const range = computeTripDateRange(trip);

async function saveItemForm(){
  const trip = getCurrentTrip();
  const { dayId, editId } = state.travel.ui.itemForm;
  const day = trip.days.find(d=>d.id===dayId);
  let item = editId ? day.items.find(i=>i.id===editId) : { id: uid() };
  item.time = val('it-time');
  item.place = val('it-place');
  item.transport = val('it-transport');
  const costVal = val('it-cost');
  item.cost = costVal==='' ? undefined : parseFloat(costVal);
  item.note = val('it-note');
  item.mapLink = val('it-map');
  item.needReservation = document.getElementById('it-reserve').checked;
  const fileInput = document.getElementById('it-image');
  if(fileInput && fileInput.files[0]){ item.image = await fileToDataURL(fileInput.files[0]); }

  state.travel.ui.itemForm = null;
  renderDaysTab(trip);
  await persistTravel();
}
async function deleteItem(dayId, itemId){
  if(!confirm('確定要刪除這個行程項目嗎？')) return;
  const trip = getCurrentTrip();
  const day = trip.days.find(d=>d.id===dayId);
  day.items = day.items.filter(i=>i.id!==itemId);
  state.travel.ui.itemForm = null;
  renderDaysTab(trip);
  await persistTravel();
}

    const editItem = ui.itemForm.editId ? items.find(i=>i.id===ui.itemForm.editId) : null;
    html += itemFormHtml(day, editItem);
  } else {
    html += `<button class="btn btn-ghost btn-sm" style="margin-top:.6rem;" onclick="openItemForm('${day.id}')">+ 新增行程項目</button>`;
  }
  html += `</div>`;
  return html;
}
function renderDaysTab(trip){
  const ui = state.travel.ui;
  const days = [...(trip.days||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let html = `<button class="btn btn-primary btn-sm" onclick="openDayForm()">+ 新增日期</button>`;
  if(ui.dayForm){
    const editingDay = ui.dayForm.editId ? days.find(d=>d.id===ui.dayForm.editId) : null;
    html += dayFormHtml(editingDay);
  }
  if(days.length===0 && !ui.dayForm){ html += `<div class="empty-state">還沒有安排任何一天，先新增第一天吧！</div>`; }
  html += days.map(dayCardHtml).join('');
  document.getElementById('travel-subtab-content').innerHTML = html;
}

      <div class="checklist-add-row">
        <input type="text" id="checklist-new-item" placeholder="新增項目，按 Enter 加入" onkeydown="if(event.key==='Enter'){addChecklistItem('${active.id}')}">
        <button class="btn btn-primary btn-sm" onclick="addChecklistItem('${active.id}')">加入</button>
      </div>
    </div>`;
  } else {
    html += `<div class="empty-state">還沒有清單，先新增一個吧（例如：行前清單）。</div>`;
  }
  document.getElementById('travel-subtab-content').innerHTML = html;
}
function setActiveChecklist(id){ state.travel.ui.activeChecklist = id; renderChecklistsTab(getCurrentTrip()); }
async function addChecklist(){
  const name = prompt('清單名稱？例如：行前清單／購物清單／美食清單');
  if(!name || !name.trim()) return;
  const trip = getCurrentTrip();
  const l = { id: uid(), name: name.trim(), items: [] };
  trip.checklists.push(l);
  state.travel.ui.activeChecklist = l.id;
  renderChecklistsTab(trip);
  await persistTravel();
}
async function renameChecklist(id){
  const trip = getCurrentTrip();
  const l = trip.checklists.find(x=>x.id===id);
  const name = prompt('重新命名清單', l.name);
  if(!name || !name.trim()) return;
  l.name = name.trim();
  renderChecklistsTab(trip);
  await persistTravel();
}
async function deleteChecklist(id){
  if(!confirm('確定刪除這份清單嗎？')) return;
  const trip = getCurrentTrip();
  trip.checklists = trip.checklists.filter(x=>x.id!==id);
  state.travel.ui.activeChecklist = null;
  renderChecklistsTab(trip);
  await persistTravel();
}
async function toggleChecklistItem(listId, itemId){
  const trip = getCurrentTrip();
  const l = trip.checklists.find(x=>x.id===listId);
  const it = l.items.find(x=>x.id===itemId);
  it.done = !it.done;
  renderChecklistsTab(trip);
  await persistTravel();
}
async function deleteChecklistItem(listId, itemId){
  const trip = getCurrentTrip();
  const l = trip.checklists.find(x=>x.id===listId);
  l.items = l.items.filter(x=>x.id!==itemId);
  renderChecklistsTab(trip);
  await persistTravel();
}
async function addChecklistItem(listId){
  const inp = document.getElementById('checklist-new-item');
  const text = inp.value.trim();
  if(!text) return;
  const trip = getCurrentTrip();
  const l = trip.checklists.find(x=>x.id===listId);
  l.items.push({ id: uid(), text, done:false });
  renderChecklistsTab(trip);
  await persistTravel();
}

/* ---- moments ---- */
function momentFormHtml(m){
  const mm = m || {};
  return `<div class="form-panel">
    <div class="field"><label>趣事 / 心情記錄</label><textarea id="moment-text" style="min-height:6rem;" placeholder="今天發生了什麼有趣的事…">${esc(mm.text)}</textarea></div>
    <div class="field"><label>照片</label><input type="file" id="moment-photo" accept="image/*">
      ${mm.photo ? `<img src="${mm.photo}" class="img-preview">` : ''}
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveMomentForm()">儲存</button>
      <button class="btn btn-ghost" onclick="closeMomentForm()">取消</button>
      ${m ? `<button class="btn btn-danger" onclick="deleteMoment('${m.id}')">刪除</button>` : ''}
    </div>
  </div>`;
}
function openMomentForm(editId){ state.travel.ui.momentForm = { editId: editId || null }; renderMomentsTab(getCurrentTrip()); }
function closeMomentForm(){ state.travel.ui.momentForm = null; renderMomentsTab(getCurrentTrip()); }
async function saveMomentForm(){
  const trip = getCurrentTrip();
  const editId = state.travel.ui.momentForm.editId;
  let m = editId ? trip.moments.find(x=>x.id===editId) : { id: uid(), createdAt: Date.now() };
  m.text = val('moment-text');
  const fileInput = document.getElementById('moment-photo');
  if(fileInput && fileInput.files[0]){ m.photo = await fileToDataURL(fileInput.files[0], 1100, 0.75); }
  if(!editId) trip.moments.push(m);
  state.travel.ui.momentForm = null;
  renderMomentsTab(trip);
  await persistTravel();
}
async function deleteMoment(id){
  if(!confirm('確定要刪除這則記錄嗎？')) return;
  const trip = getCurrentTrip();
  trip.moments = trip.moments.filter(x=>x.id!==id);
  state.travel.ui.momentForm = null;
  renderMomentsTab(trip);
  await persistTravel();
}
function renderMomentsTab(trip){
  const ui = state.travel.ui;
  let html = `<button class="btn btn-primary btn-sm" onclick="openMomentForm()">+ 新增趣事</button>`;
  if(ui.momentForm){
    const editing = ui.momentForm.editId ? trip.moments.find(m=>m.id===ui.momentForm.editId) : null;
    html += momentFormHtml(editing);
  }
  const moments = [...(trip.moments||[])].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(moments.length===0 && !ui.momentForm){ html += `<div class="empty-state">還沒有記錄旅途中的趣事，寫下第一則吧！</div>`; }
  html += moments.map(m => `
    <div class="moment-card">
      ${m.photo ? `<img src="${m.photo}" class="moment-photo" alt="">` : ''}
      <div class="moment-text">${esc(m.text)}</div>
      <button class="tiny-link" onclick="openMomentForm('${m.id}')">編輯</button>
    </div>`).join('');
  document.getElementById('travel-subtab-content').innerHTML = html;
}

/* ---- expense ---- */
function renderExpenseTab(trip){
  const days = [...(trip.days||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let total = 0;
  const dayRows = days.map(day => {
    let sum = 0;
    (day.items||[]).forEach(it => { const c=parseFloat(it.cost); if(!isNaN(c)) sum += c; });
    total += sum;
    return { date: day.date, stay: day.stay, sum };
  });
  const itemRows = [];
  days.forEach(day => (day.items||[]).forEach(it => { const c=parseFloat(it.cost); if(!isNaN(c) && c!==0) itemRows.push({date:day.date, place:it.place, cost:c}); }));
  itemRows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  let html = `<div class="expense-total">💰 總花費<br><span class="expense-total-num brush">${formatMoney(total)}</span></div>`;
  if(dayRows.length===0){
    html += `<div class="empty-state">還沒有任何花費紀錄，去「每日行程」加入項目時填上費用吧。</div>`;
  } else {
    html += `<div class="expense-daylist">` + dayRows.map(d =>
      `<div class="expense-day-row"><span>${esc(fmtDayLabel(d.date))}${d.stay?`・${esc(d.stay)}`:''}</span><span>${formatMoney(d.sum)}</span></div>`
    ).join('') + `</div>`;
    if(itemRows.length){
      html += `<div class="subtab-h" style="margin-top:1.2rem;">明細</div><div class="expense-itemlist">` + itemRows.map(r =>
        `<div class="expense-item-row"><span>${esc(fmtDayLabel(r.date))} ・ ${esc(r.place||'未命名項目')}</span><span>${formatMoney(r.cost)}</span></div>`
      ).join('') + `</div>`;
    }
  }
  document.getElementById('travel-subtab-content').innerHTML = html;
}

/* ===================== generic engine (diary / recipes / books) ===================== */
function formShell(moduleKey, innerFieldsHtml){
  return `<div class="form-panel">
      ${innerFieldsHtml}
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveForm('${moduleKey}')">儲存</button>
        <button class="btn btn-ghost" onclick="closeForm('${moduleKey}')">取消</button>
        <button class="btn btn-danger hidden" id="${moduleKey}-delete-btn" onclick="deleteEntry('${moduleKey}')">刪除這筆</button>
      </div>
    </div>`;
}
function openForm(moduleKey, entry){
  state[moduleKey].editingId = entry ? entry.id : null;
  const slot = document.getElementById(moduleKey + '-form-slot');
  slot.innerHTML = formBuilders[moduleKey](entry || {});
  const delBtn = document.getElementById(moduleKey + '-delete-btn');
  if(delBtn && entry) delBtn.classList.remove('hidden');
  slot.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeForm(moduleKey){ state[moduleKey].editingId = null; document.getElementById(moduleKey + '-form-slot').innerHTML = ''; }

const formBuilders = {
  diary: (e) => formShell('diary', `
    <div class="row-2">
      <div class="field"><label>日期</label><input type="date" id="diary-date" value="${esc(e.date || new Date().toISOString().slice(0,10))}"></div>
      <div class="field"><label>心情</label>
        <select id="diary-mood">${['😊','😌','😐','😔','😤','🥱','🤩'].map(m=>`<option value="${m}" ${e.mood===m?'selected':''}>${m}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>標題</label><input type="text" id="diary-title" value="${esc(e.title)}" placeholder="今天的一句話標題"></div>
    <div class="field"><label>內容</label><textarea id="diary-content" style="min-height:8rem;" placeholder="寫下今天發生的事…">${esc(e.content)}</textarea></div>
  `),
  recipes: (e) => formShell('recipes', `
    <div class="row-2">
      <div class="field"><label>菜名</label><input type="text" id="recipe-name" value="${esc(e.name)}" placeholder="蔥油拌麵"></div>
      <div class="field"><label>分類</label><input type="text" id="recipe-category" value="${esc(e.category)}" placeholder="家常菜／烘焙…"></div>
    </div>
    <div class="row-2">
      <div class="field"><label>份量</label><input type="text" id="recipe-servings" value="${esc(e.servings)}" placeholder="2人份"></div>
      <div class="field"><label>評分（0-5）</label><input type="number" id="recipe-rating" min="0" max="5" value="${e.rating!==undefined?e.rating:''}"></div>
    </div>
    <div class="field"><label>食材（一行一項）</label><textarea id="recipe-ingredients" placeholder="麵條 200g&#10;蔥 3根&#10;醬油 1大匙">${esc((e.ingredients||[]).join('\\n'))}</textarea></div>
    <div class="field"><label>做法（一行一步）</label><textarea id="recipe-steps" style="min-height:6rem;" placeholder="1. 蔥切段爆香&#10;2. 拌入麵條">${esc((e.steps||[]).join('\\n'))}</textarea></div>
    <div class="field"><label>備註</label><textarea id="recipe-notes" placeholder="下次想調整的地方…">${esc(e.notes)}</textarea></div>
  `),
  books: (e) => formShell('books', `
    <div class="row-2">
      <div class="field"><label>書名</label><input type="text" id="book-title" value="${esc(e.title)}" placeholder="小王子"></div>
      <div class="field"><label>作者</label><input type="text" id="book-author" value="${esc(e.author)}" placeholder="安東尼·聖修伯里"></div>
    </div>
    <div class="row-2">
      <div class="field"><label>狀態</label>
        <select id="book-status">
          <option value="想讀" ${e.status==='想讀'?'selected':''}>想讀</option>
          <option value="在讀" ${e.status==='在讀'?'selected':''}>在讀</option>
          <option value="讀完" ${e.status==='讀完'?'selected':''}>讀完</option>
        </select>
      </div>
      <div class="field"><label>評分（0-5）</label><input type="number" id="book-rating" min="0" max="5" value="${e.rating!==undefined?e.rating:''}"></div>
    </div>
    <div class="field"><label>完成日期（選填）</label><input type="date" id="book-date" value="${esc(e.dateFinished)}"></div>
    <div class="field"><label>心得</label><textarea id="book-notes" style="min-height:7rem;" placeholder="這本書帶給你的想法…">${esc(e.notes)}</textarea></div>
  `),
};

async function saveForm(moduleKey){
  const list = state[moduleKey].entries;
  const editingId = state[moduleKey].editingId;
  let entry = editingId ? list.find(x=>x.id===editingId) : { id: uid(), createdAt: Date.now() };
  if(!entry) entry = { id: uid(), createdAt: Date.now() };

  if(moduleKey==='diary'){
    entry.date = val('diary-date') || new Date().toISOString().slice(0,10);
    entry.mood = val('diary-mood');
    entry.title = val('diary-title').trim() || '無題';
    entry.content = val('diary-content');
  } else if(moduleKey==='recipes'){
    entry.name = val('recipe-name').trim() || '未命名料理';
    entry.category = val('recipe-category').trim();
    entry.servings = val('recipe-servings').trim();
    const ratingVal = val('recipe-rating');
    entry.rating = ratingVal === '' ? undefined : Math.max(0, Math.min(5, parseInt(ratingVal,10)));
    entry.ingredients = val('recipe-ingredients').split('\n').map(s=>s.trim()).filter(Boolean);
    entry.steps = val('recipe-steps').split('\n').map(s=>s.trim()).filter(Boolean);
    entry.notes = val('recipe-notes');
  } else if(moduleKey==='books'){
    entry.title = val('book-title').trim() || '未命名書籍';
    entry.author = val('book-author').trim();
    entry.status = val('book-status');
    const ratingVal = val('book-rating');
    entry.rating = ratingVal === '' ? undefined : Math.max(0, Math.min(5, parseInt(ratingVal,10)));
    entry.dateFinished = val('book-date');
    entry.notes = val('book-notes');
  }

  if(!editingId) list.push(entry);
  state[moduleKey].entries = list;
  closeForm(moduleKey);
  render[moduleKey]();
  await saveEntries(moduleKey, list);
}
async function deleteEntry(moduleKey){
  const editingId = state[moduleKey].editingId;
  if(!editingId) return;
  if(!confirm('確定要刪除這一筆嗎？刪除後就找不回來了。')) return;
  state[moduleKey].entries = state[moduleKey].entries.filter(x=>x.id!==editingId);
  closeForm(moduleKey);
  render[moduleKey]();
  await saveEntries(moduleKey, state[moduleKey].entries);
}

const render = {
  diary(){
    const list = [...state.diary.entries].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const el = document.getElementById('diary-list');
    if(list.length===0){ el.innerHTML = '<div class="empty-state">今天還沒寫下什麼，要不要留一段話給未來的自己？</div>'; return; }
    el.innerHTML = list.map(e => `
      <div class="diary-entry">
        <div class="diary-top"><span class="diary-date">${esc(fmtDate(e.date))}</span><span class="diary-mood">${esc(e.mood||'')}</span></div>
        <div class="diary-title brush">${esc(e.title)}</div>
        <div class="diary-content">${esc(e.content)}</div>
        <button class="tiny-link" onclick='openForm("diary", ${attrJson(e)})'>編輯</button>
      </div>`).join('');
  },
  recipes(){
    const list = [...state.recipes.entries].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const el = document.getElementById('recipes-list');
    if(list.length===0){ el.innerHTML = '<div class="empty-state">食譜盒是空的，把第一道拿手菜記下來吧。</div>'; return; }
    el.innerHTML = list.map(e => `
      <div class="recipe-card">
        <div class="recipe-top"><span class="recipe-name brush">${esc(e.name)}</span><span class="recipe-meta">${esc(e.category||'')}${e.servings?`・${esc(e.servings)}`:''}</span></div>
        ${e.rating!==undefined?`<div class="recipe-stars">${stars(e.rating)}</div>`:''}
        ${(e.ingredients&&e.ingredients.length)?`<div class="recipe-section-label">食材</div><ul class="recipe-list">${e.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
        ${(e.steps&&e.steps.length)?`<div class="recipe-section-label">做法</div><ol class="recipe-list">${e.steps.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`:''}
        ${e.notes?`<div class="recipe-notes">${esc(e.notes)}</div>`:''}
        <button class="tiny-link" onclick='openForm("recipes", ${attrJson(e)})'>編輯</button>
      </div>`).join('');
  },
  books(){
    const order = {'在讀':0,'想讀':1,'讀完':2};
    const list = [...state.books.entries].sort((a,b)=>(order[a.status]??3)-(order[b.status]??3) || (b.createdAt||0)-(a.createdAt||0));
    const el = document.getElementById('books-list');
    if(list.length===0){ el.innerHTML = '<div class="empty-state">書架還空著，寫下正在讀或想讀的第一本書。</div>'; return; }
    el.innerHTML = list.map(e => `
      <div class="book-card">
        <div class="book-spine"></div>
        <div class="book-main">
          <div class="book-top">
            <div><span class="book-title brush">${esc(e.title)}</span>${e.author?`<div class="book-author">${esc(e.author)}</div>`:''}</div>
            <span class="book-status">${esc(e.status||'想讀')}</span>
          </div>
          ${e.rating!==undefined?`<div class="book-stars">${stars(e.rating)}</div>`:''}
          ${e.dateFinished?`<div class="book-author">完成於 ${esc(fmtDate(e.dateFinished))}</div>`:''}
          ${e.notes?`<div class="book-notes">${esc(e.notes)}</div>`:''}
          <button class="tiny-link" onclick='openForm("books", ${attrJson(e)})'>編輯</button>
        </div>
      </div>`).join('');
  }
};
</script>
